<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canyon Rally</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a0d;color:#f7f2e9;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;padding:22px}.shell{width:min(1120px,100%);border:1px solid #ffe1b76b;border-radius:28px;padding:18px;background:linear-gradient(140deg,#3e2117e6,#130d0ee8 58%,#17100edc);box-shadow:0 30px 90px #000;position:relative;overflow:hidden}.shell:before{content:"";position:absolute;inset:0;opacity:.22;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 40px,#ffb4660a 41px 42px)}header{display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative;margin:1px 2px 15px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:conic-gradient(from 210deg,#642510,#e66128,#ffd281,#542014);box-shadow:inset 0 1px #fff8,0 0 25px #df642951;display:grid;place-items:center;color:#140805;font-weight:900;font-size:21px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#eab88c;margin:0 0 2px}h1{font-size:25px;letter-spacing:-.055em;margin:0}.hub{border:1px solid #ffd8aa66;border-radius:11px;background:#ffffff10;color:#ffe7cc;padding:10px 13px;font-size:12px;font-weight:800;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px)}.hub:hover{background:#ffffff25}.stage{position:relative;overflow:hidden;border:1px solid #fbd7ae75;border-radius:20px;background:#170e0a;box-shadow:inset 0 0 45px #000b}.stage:before{content:"";position:absolute;z-index:2;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 70px #0009}canvas{display:block;width:100%;height:auto;aspect-ratio:920/560;touch-action:none}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:13px 4px 0}.stat{min-width:0;padding:9px 11px;border:1px solid #ffffff20;border-radius:12px;background:#00000042}.stat label{display:block;color:#e5b889;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.stat b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px;font-size:15px}.hint{text-align:center;margin:13px 3px 0;color:#e5c2a0;font-size:12px}.hint kbd{border:1px solid #ffffff55;border-radius:5px;background:#0008;padding:2px 5px;color:#fff;font-family:inherit;font-size:10px}@media(max-width:600px){body{padding:8px}.shell{padding:11px;border-radius:19px}h1{font-size:21px}.mark{width:36px;height:36px}.hud{grid-template-columns:1fr 1fr}.stat:nth-child(4){display:none}.hint{font-size:11px}}
</style></head><body><main class="shell"><header><div class="brand"><div class="mark">R</div><div><p class="eyebrow">Off-road world series</p><h1>Canyon Rally</h1></div></div><a class="hub" href="arcade-launcher.html">← Game Hub</a></header><div class="stage"><canvas id="game" width="920" height="560" aria-label="Canyon Rally driving game"></canvas></div><section class="hud"><div class="stat"><label>Route</label><b id="route">Redstone Pass</b></div><div class="stat"><label>Distance</label><b id="distance">0 / 1200 m</b></div><div class="stat"><label>Armor</label><b id="armor">● ● ●</b></div><div class="stat"><label>Score</label><b id="score">0</b></div></section><p class="hint"><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> steer · <kbd>↑</kbd> accelerate · <kbd>Space</kbd> boost · <kbd>Esc</kbd> Game Hub</p></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height,bg=new Image();bg.src='canyon-rally-route.png';const $=q=>document.querySelector(q);let keys={},last=0,mode='intro',level=0,score=0,distance=0,armor=3,boost=100,traffic=[],dust=[],flash=0,toast=0;
const routes=[['Redstone Pass',1200,'#ff9e54'],['Thunder Mesa',1550,'#bda1ff'],['Sunrise Rim',1950,'#ffe095']];let car={x:W*.5,y:H-102,v:0};
function tone(f=.0,d=.08,t='sine',v=.04){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function reset(all=false){if(all){level=0;score=0;}distance=0;armor=3;boost=100;traffic=[];dust=[];car={x:W*.5,y:H-102,v:0};mode='play';toast=2.8;update();tone(220,.18,'sawtooth')}
function update(){let r=routes[level];$('#route').textContent=r[0];$('#distance').textContent=Math.floor(distance)+' / '+r[1]+' m';$('#armor').textContent='● '.repeat(armor)+'○ '.repeat(3-armor);$('#score').textContent=score.toLocaleString()}
function imgCover(im){let s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h)}
function spawn(){let danger=Math.random()<.72;traffic.push({x:danger?150+Math.random()*620:70+Math.random()*780,y:-70,kind:danger?'truck':'rock',z:.55+Math.random()*.45,passed:false,w:danger?40+Math.random()*16:26+Math.random()*25})}
function collide(a,b){return Math.abs(a.x-b.x)<(a.w||38)+28&&Math.abs(a.y-b.y)<(a.h||55)+32}
function tick(t){let dt=Math.min(.033,(t-last||16)/1000);last=t;if(mode==='play'){let r=routes[level],move=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0),fast=keys.ArrowUp?1:0,using=keys[' ']&&boost>0;car.v+=(fast?220:70)*dt;car.v-=car.v*1.6*dt;car.v=Math.min(car.v,using?370:260);if(using){boost=Math.max(0,boost-31*dt);car.v=Math.min(420,car.v+170*dt)}else boost=Math.min(100,boost+10*dt);car.x+=move*(250+car.v*.42)*dt;car.x=Math.max(80,Math.min(W-80,car.x));distance+=car.v*.34*dt;flash=Math.max(0,flash-dt);toast=Math.max(0,toast-dt);
if(Math.random()<dt*(.55+level*.25))spawn();traffic.forEach(o=>{o.y+=(92+car.v*.72)*(1+level*.12)*dt;o.x+=Math.sin(t*.002+o.y)*11*dt;if(!o.passed&&o.y>car.y+72){o.passed=true;score+=80}if(!o.hit&&collide({x:car.x,y:car.y,w:29,h:45},{x:o.x,y:o.y,w:o.w,h:o.w*.8})){o.hit=true;armor--;flash=.38;score=Math.max(0,score-150);tone(82,.2,'square',.08);for(let i=0;i<18;i++)dust.push({x:car.x,y:car.y,vx:(Math.random()-.5)*210,vy:(Math.random()-.5)*160,l:1});if(armor<=0){mode='over';tone(60,.5,'sawtooth')}}});traffic=traffic.filter(o=>o.y<H+100&&!o.hit);dust.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});dust=dust.filter(p=>p.l>0);if(distance>=r[1]){score+=500+armor*140;if(level<routes.length-1){level++;distance=0;traffic=[];mode='between';toast=2.6;setTimeout(()=>{if(mode==='between')mode='play'},1500);tone(490,.16,'triangle',.07)}else{mode='win';tone(660,.35,'triangle',.08)}}update()}draw(t);requestAnimationFrame(tick)}
function roadCar(){x.save();x.translate(car.x,car.y);x.shadowColor='#000';x.shadowBlur=18;x.fillStyle='#111923';x.beginPath();x.roundRect(-25,-46,50,93,15);x.fill();x.fillStyle='#dd532f';x.beginPath();x.roundRect(-20,-39,40,77,12);x.fill();x.fillStyle='#151d28';x.beginPath();x.roundRect(-15,-29,30,29,8);x.fill();x.fillStyle='#f7b36f';x.fillRect(-17,12,34,8);x.fillStyle='#ffeaa6';x.fillRect(-19,-35,7,8);x.fillRect(12,-35,7,8);x.fillStyle='#ff4a30';x.fillRect(-19,31,7,7);x.fillRect(12,31,7,7);x.restore()}
function drawObject(o){x.save();x.translate(o.x,o.y);let s=.65+o.y/H*.9;x.scale(s,s);x.shadowColor='#000b';x.shadowBlur=15;if(o.kind==='truck'){x.fillStyle='#17202a';x.beginPath();x.roundRect(-o.w/2,-32,o.w,64,9);x.fill();x.fillStyle='#5f7e91';x.fillRect(-o.w/2+6,-25,o.w-12,23);x.fillStyle='#ffd66a';x.fillRect(-o.w/2+6,22,9,6);x.fillRect(o.w/2-15,22,9,6)}else{x.fillStyle='#6b3b24';x.beginPath();x.moveTo(-o.w/2,20);x.lineTo(-o.w*.34,-18);x.lineTo(o.w*.26,-24);x.lineTo(o.w/2,15);x.closePath();x.fill();x.fillStyle='#bd7646';x.beginPath();x.arc(-5,-8,8,0,7);x.fill()}x.restore()}
function draw(t){x.clearRect(0,0,W,H);if(bg.complete)imgCover(bg);else{x.fillStyle='#5c281c';x.fillRect(0,0,W,H)}let tint=routes[level]?.[2]||'#fff';x.fillStyle=level===1?'#27194822':level===2?'#ffbe5822':'#9c301210';x.fillRect(0,0,W,H);x.save();x.globalAlpha=.22;x.strokeStyle='#ffe4a3';x.lineWidth=4;for(let yy=((t*.36)%75)-80;yy<H;yy+=75){let p=(yy+100)/H;x.beginPath();x.moveTo(W*.5-6*p,yy);x.lineTo(W*.5+6*p,yy+35+30*p);x.stroke()}x.restore();traffic.sort((a,b)=>a.y-b.y).forEach(drawObject);dust.forEach(p=>{x.fillStyle='#f7ca91';x.globalAlpha=p.l;x.beginPath();x.arc(p.x,p.y,5*(1-p.l)+2,0,7);x.fill();x.globalAlpha=1});roadCar();let m=x.createLinearGradient(0,H*.6,0,H);m.addColorStop(0,'transparent');m.addColorStop(1,'#00000080');x.fillStyle=m;x.fillRect(0,0,W,H);let gauge=boost/100;x.fillStyle='#0009';x.roundRect(25,H-43,145,18,9);x.fill();x.fillStyle='#ffe692';x.roundRect(28,H-40,139*gauge,12,6);x.fill();x.fillStyle='#fff';x.font='700 10px -apple-system';x.fillText('BOOST',31,H-28);
if(flash){x.fillStyle='#fff';x.globalAlpha=flash*.55;x.fillRect(0,0,W,H);x.globalAlpha=1}if(mode!=='play'||toast){let title=mode==='intro'?'CANYON RALLY':mode==='over'?'RALLY OVER':mode==='win'?'CANYON MASTERED':mode==='between'?'CHECKPOINT CLEARED':'';let sub=mode==='intro'?'Press Enter or click to start':mode==='over'?'Press Enter to run it again':mode==='win'?'Three routes conquered — press Enter for a new run':mode==='between'?routes[level][0]+' unlocked':routes[level]?.[0]||'';if(title){x.fillStyle='#0605069e';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff7e4';x.font='900 42px -apple-system';x.fillText(title,W/2,H/2-15);x.fillStyle='#f1c195';x.font='600 16px -apple-system';x.fillText(sub,W/2,H/2+21);x.textAlign='left'}}}
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key==='Escape')location.href='arcade-launcher.html';if(e.key==='Enter'&&(mode==='intro'||mode==='over'||mode==='win'))reset(mode!=='over');});addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('click',()=>{if(mode==='intro'||mode==='over'||mode==='win')reset(mode!=='over')});requestAnimationFrame(tick)})();
</script></body></html>
