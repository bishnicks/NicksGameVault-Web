:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 48% 0,#4f8953,#09140b 66%,#030704);color:#f4fff4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.shell{width:min(1120px,100%);padding:18px;border:1px solid #d3ffbd68;border-radius:28px;background:linear-gradient(135deg,#193e1be8,#0c1d0fe8 56%,#24401fe2);box-shadow:0 30px 90px #000;position:relative;overflow:hidden}.shell:before{content:"";position:absolute;inset:0;opacity:.24;pointer-events:none;background:radial-gradient(circle at 20% 0,#f8ffb530 0 2px,transparent 3px),radial-gradient(circle at 88% 70%,#c8ffcf2a 0 2px,transparent 3px);background-size:53px 53px,71px 71px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative;margin:1px 2px 15px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#f4d666,#80d886 48%,#1a825b);box-shadow:inset 0 1px #fff8,0 0 25px #dcff7757;display:grid;place-items:center;font-size:22px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#d6f99d;margin:0 0 2px}h1{font-size:25px;letter-spacing:-.055em;margin:0}.hub{border:1px solid #dfffc266;border-radius:11px;background:#ffffff10;color:#efffde;padding:10px 13px;font-size:12px;font-weight:800;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px)}.hub:hover{background:#ffffff25}.stage{position:relative;overflow:hidden;border:1px solid #ddffc27a;border-radius:20px;background:#08200d;box-shadow:inset 0 0 45px #000b}.stage:before{content:"";position:absolute;z-index:2;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 72px #0009}canvas{display:block;width:100%;height:auto;aspect-ratio:920/560;touch-action:none}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:13px 4px 0}.stat{min-width:0;padding:9px 11px;border:1px solid #ffffff20;border-radius:12px;background:#00000042}.stat label{display:block;color:#c8f5a5;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.stat b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px;font-size:15px}.hint{text-align:center;margin:13px 3px 0;color:#d0eac5;font-size:12px}.hint kbd{border:1px solid #ffffff55;border-radius:5px;background:#0008;padding:2px 5px;color:#fff;font-family:inherit;font-size:10px}@media(max-width:600px){body{padding:8px}.shell{padding:11px;border-radius:19px}h1{font-size:21px}.mark{width:36px;height:36px}.hud{grid-template-columns:1fr 1fr}.stat:nth-child(4){display:none}.hint{font-size:11px}}
</style></head><body><main class="shell"><header><div class="brand"><div class="mark">✦</div><div><p class="eyebrow">Wildflight sanctuary</p><h1>Hummingbird Haven</h1></div></div><a class="hub" href="arcade-launcher.html">← Game Hub</a></header><div class="stage"><canvas id="game" width="920" height="560" aria-label="Hummingbird Haven flight game"></canvas></div><section class="hud"><div class="stat"><label>Sanctuary</label><b id="sanctuary">Sunlit Garden</b></div><div class="stat"><label>Nectar</label><b id="nectar">0 / 10</b></div><div class="stat"><label>Hearts</label><b id="hearts">♥ ♥ ♥</b></div><div class="stat"><label>Flight score</label><b id="score">0</b></div></section><p class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows fly · <kbd>Space</kbd> burst · sip every bloom · <kbd>Esc</kbd> Game Hub</p></main><script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height,bg=new Image();bg.src='hummingbird-haven-garden.png';const $=q=>document.querySelector(q);let keys={},last=0,mode='intro',level=0,score=0,nectar=0,hearts=3,burst=100,flowers=[],gusts=[],motes=[],notice='',noticeT=0;let bird={x:W*.5,y:H*.57,vx:0,vy:0,ang:0,immune:0};const sanctuaries=[['Sunlit Garden',10,'#fff0a6'],['Rainflower Hollow',12,'#6fd7ff'],['Twilight Orchard',14,'#dba5ff']];
function tone(f,d=.09,type='sine',v=.04){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function seed(){flowers=[];gusts=[];for(let i=0;i<sanctuaries[level][1]+4;i++)flowers.push({x:85+Math.random()*750,y:100+Math.random()*390,r:13+Math.random()*5,h:Math.random()*360,got:false,spin:Math.random()*6});for(let i=0;i<2+level;i++)gusts.push({x:70+Math.random()*780,y:110+Math.random()*330,v:(Math.random()<.5?-1:1)*(38+level*16),r:32+Math.random()*18,a:Math.random()*7})}
function reset(all=false){if(all){level=0;score=0;}nectar=0;hearts=3;burst=100;bird={x:W*.5,y:H*.57,vx:0,vy:0,ang:0,immune:0};motes=[];seed();mode='play';notice='Follow the blooms. Avoid the gusts.';noticeT=3;sync();tone(470,.12,'triangle')}
function sync(){let s=sanctuaries[level];$('#sanctuary').textContent=s[0];$('#nectar').textContent=nectar+' / '+s[1];$('#hearts').textContent='♥ '.repeat(hearts)+'♡ '.repeat(3-hearts);$('#score').textContent=score.toLocaleString()}
function cover(im){let s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h)}
function hit(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}
function tick(t){let dt=Math.min(.033,(t-last||16)/1000);last=t;if(mode==='play'){let mx=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0),my=(keys.ArrowUp||keys.w?-1:0)+(keys.ArrowDown||keys.s?1:0),use=keys[' ']&&burst>0;bird.vx+=(mx*520)*dt;bird.vy+=(my*520)*dt;if(use){bird.vx+=mx*360*dt;bird.vy+=my*360*dt;burst=Math.max(0,burst-42*dt)}else burst=Math.min(100,burst+13*dt);bird.vx*=Math.pow(.002,dt);bird.vy*=Math.pow(.002,dt);let speed=Math.hypot(bird.vx,bird.vy),max=use?390:255;if(speed>max){bird.vx*=max/speed;bird.vy*=max/speed}bird.x=Math.max(35,Math.min(W-35,bird.x+bird.vx*dt));bird.y=Math.max(65,Math.min(H-35,bird.y+bird.vy*dt));bird.ang=Math.atan2(bird.vy,bird.vx);bird.immune=Math.max(0,bird.immune-dt);flowers.forEach(f=>{f.spin+=dt*2;if(!f.got&&hit(bird,f,26)){f.got=true;nectar++;score+=100+level*40;notice='Nectar gathered!';noticeT=.8;tone(620,.07,'triangle',.06);for(let i=0;i<12;i++)motes.push({x:f.x,y:f.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,l:1,col:sanctuaries[level][2]});if(nectar>=sanctuaries[level][1]){if(level<sanctuaries.length-1){level++;mode='between';notice=sanctuaries[level][0]+' unlocked.';noticeT=3;tone(780,.22,'triangle',.08);setTimeout(()=>{if(mode==='between'){nectar=0;seed();mode='play';sync()}},1600)}else{mode='win';notice='All sanctuaries restored.';noticeT=5}}}});gusts.forEach(g=>{g.x+=g.v*dt;g.a+=dt*3;if(g.x<20||g.x>W-20)g.v*=-1;if(!bird.immune&&hit(bird,g,g.r)){hearts--;bird.immune=1.3;bird.vx+=Math.cos(g.a)*210;bird.vy+=Math.sin(g.a)*210;notice='A strong gust!';noticeT=1.5;tone(130,.12,'sawtooth',.07);if(hearts<=0){mode='over';tone(68,.45,'square',.06)}}});motes.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});motes=motes.filter(p=>p.l>0);noticeT=Math.max(0,noticeT-dt);sync()}draw(t);requestAnimationFrame(tick)}
function flower(f){x.save();x.translate(f.x,f.y);x.rotate(f.spin*.16);for(let i=0;i<7;i++){x.rotate(Math.PI*2/7);x.fillStyle=`hsl(${f.h+i*8} 82% 63%)`;x.beginPath();x.ellipse(0,-f.r,6,f.r,0,0,7);x.fill()}x.fillStyle='#ffed7e';x.beginPath();x.arc(0,0,f.r*.44,0,7);x.fill();x.restore()}
function drawBird(t){x.save();x.translate(bird.x,bird.y);x.rotate(bird.ang||0);let flap=Math.sin(t*.05)*.55;x.globalAlpha=bird.immune&&Math.floor(t*.015)%2?.42:1;x.fillStyle='#c6fbff77';x.beginPath();x.ellipse(-12,flap*18-7,27,5,flap,0,7);x.fill();x.fillStyle='#c6fbff77';x.beginPath();x.ellipse(-12,-flap*18+7,27,5,-flap,0,7);x.fill();x.shadowColor='#fff7b5';x.shadowBlur=11;x.fillStyle='#20a17d';x.beginPath();x.ellipse(0,0,18,10,0,0,7);x.fill();x.fillStyle='#8cf3ce';x.beginPath();x.ellipse(5,-3,11,6,0,0,7);x.fill();x.fillStyle='#de5667';x.beginPath();x.arc(12,-6,6,0,7);x.fill();x.fillStyle='#101a1b';x.beginPath();x.arc(15,-7,1.6,0,7);x.fill();x.fillStyle='#2c2520';x.beginPath();x.moveTo(18,-4);x.lineTo(30,-1);x.lineTo(18,1);x.closePath();x.fill();x.restore()}
function draw(t){x.clearRect(0,0,W,H);if(bg.complete)cover(bg);else{x.fillStyle='#326d35';x.fillRect(0,0,W,H)}if(level===1){x.fillStyle='#144f8a36';x.fillRect(0,0,W,H)}if(level===2){x.fillStyle='#45205d32';x.fillRect(0,0,W,H)}x.save();x.globalAlpha=.16;x.fillStyle='#fff9ca';for(let i=0;i<60;i++){let px=(i*83+t*.015*(i%4))%W,py=(i*131+t*.01*(i%3))%H;x.beginPath();x.arc(px,py,1+(i%3),0,7);x.fill()}x.restore();flowers.filter(f=>!f.got).forEach(flower);gusts.forEach(g=>{x.save();x.translate(g.x,g.y);x.rotate(g.a);x.strokeStyle='#d8f3ff99';x.lineWidth=3;x.beginPath();x.arc(0,0,g.r,0,Math.PI*1.5);x.stroke();x.beginPath();x.arc(0,0,g.r*.58,Math.PI*.3,Math.PI*1.85);x.stroke();x.restore()});motes.forEach(p=>{x.globalAlpha=p.l;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill();x.globalAlpha=1});drawBird(t);x.fillStyle='#0012047d';x.roundRect(24,H-46,142,17,9);x.fill();x.fillStyle='#c8ff8c';x.roundRect(27,H-43,136*(burst/100),11,6);x.fill();x.fillStyle='#fff';x.font='700 10px -apple-system';x.fillText('BURST',31,H-31);if(mode!=='play'){x.fillStyle='#0713089d';x.fillRect(0,0,W,H);let title=mode==='intro'?'HUMMINGBIRD HAVEN':mode==='over'?'WINGS NEED REST':mode==='win'?'SANCTUARIES RESTORED':mode==='between'?'NEW SANCTUARY':'';let sub=mode==='intro'?'Press Enter or click to take flight':mode==='over'?'Press Enter to return to the garden':mode==='win'?'You brought life back to every bloom.':notice;x.textAlign='center';x.fillStyle='#f7ffe8';x.font='900 39px -apple-system';x.fillText(title,W/2,H/2-16);x.fillStyle='#d4f0bf';x.font='600 16px -apple-system';x.fillText(sub,W/2,H/2+22);x.textAlign='left'}else if(noticeT){x.textAlign='center';x.fillStyle='#061304bf';x.roundRect(W/2-165,35,330,38,19);x.fill();x.fillStyle='#efffe5';x.font='700 14px -apple-system';x.fillText(notice,W/2,59);x.textAlign='left'}}
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='Escape')location.href='arcade-launcher.html';if(e.key==='Enter'&&(mode==='intro'||mode==='over'||mode==='win'))reset(mode!=='over')});addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('click',()=>{if(mode==='intro'||mode==='over'||mode==='win')reset(mode!=='over')});const mobileStyle=document.createElement('style');mobileStyle.textContent='*{-webkit-tap-highlight-color:transparent}.touch-controls{display:none;align-items:center;justify-content:space-between;gap:20px;padding:12px 10px 0}.touch-stick{display:grid;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(2,49px);gap:6px}.touch-stick button{border:1px solid #dfffc266;border-radius:11px;background:#173c22;color:#fff;font-size:20px;touch-action:none}.touch-stick [data-key="ArrowUp"]{grid-column:2}.touch-stick [data-key="ArrowLeft"]{grid-column:1}.touch-stick [data-key="ArrowDown"]{grid-column:2}.touch-stick [data-key="ArrowRight"]{grid-column:3}.burst-button{width:78px;height:78px;border:1px solid #fff4a677;border-radius:50%;background:linear-gradient(145deg,#efcf56,#397c51);color:#102414;font-weight:900;touch-action:none}@media(max-width:600px),(pointer:coarse){html,body{overscroll-behavior:none}body{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));-webkit-user-select:none;user-select:none}.touch-controls{display:flex}.shell{padding:8px}header{margin-bottom:8px}.eyebrow{display:none}canvas{touch-action:none}.hud{padding-top:8px}}';document.head.appendChild(mobileStyle);document.querySelector('.stage').insertAdjacentHTML('afterend','<div class="touch-controls" aria-label="Touch flight controls"><div class="touch-stick"><button data-key="ArrowUp" aria-label="Fly up">▲</button><button data-key="ArrowLeft" aria-label="Fly left">◀</button><button data-key="ArrowDown" aria-label="Fly down">▼</button><button data-key="ArrowRight" aria-label="Fly right">▶</button></div><button class="burst-button" data-key=" " aria-label="Use burst">BURST</button></div>');document.querySelectorAll('[data-key]').forEach(btn=>{const down=e=>{e.preventDefault();if(mode==='intro'||mode==='over'||mode==='win')reset(mode!=='over');keys[btn.dataset.key]=true;btn.setPointerCapture?.(e.pointerId)},up=e=>{e.preventDefault();keys[btn.dataset.key]=false};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up)});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});requestAnimationFrame(tick)})();
