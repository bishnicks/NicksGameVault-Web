<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lighthouse Angler</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 45% 0,#316783,#07141d 62%,#03070b);color:#eefbff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.shell{width:min(1120px,100%);padding:18px;border:1px solid #bfeaff62;border-radius:28px;background:linear-gradient(135deg,#11354ee8,#07151eea 55%,#142c38e8);box-shadow:0 30px 90px #000;position:relative;overflow:hidden}.shell:before{content:"";position:absolute;inset:0;opacity:.3;pointer-events:none;background:linear-gradient(115deg,transparent 20%,#b8f6ff0b 45%,transparent 60%)}header{display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative;margin:1px 2px 15px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#5de3fa,#1478a5 60%,#073752);box-shadow:inset 0 1px #fff8,0 0 25px #43d9f057;display:grid;place-items:center;font-size:21px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#9ee5f3;margin:0 0 2px}h1{font-size:25px;letter-spacing:-.055em;margin:0}.hub{border:1px solid #c8efff66;border-radius:11px;background:#ffffff10;color:#e7faff;padding:10px 13px;font-size:12px;font-weight:800;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px)}.hub:hover{background:#ffffff25}.stage{position:relative;overflow:hidden;border:1px solid #d7f6ff77;border-radius:20px;background:#061927;box-shadow:inset 0 0 45px #000b}.stage:before{content:"";position:absolute;z-index:2;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 72px #0009}canvas{display:block;width:100%;height:auto;aspect-ratio:920/560}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:13px 4px 0}.stat{min-width:0;padding:9px 11px;border:1px solid #ffffff20;border-radius:12px;background:#00000042}.stat label{display:block;color:#98ddea;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.stat b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px;font-size:15px}.hint{text-align:center;margin:13px 3px 0;color:#b9ddea;font-size:12px}.hint kbd{border:1px solid #ffffff55;border-radius:5px;background:#0008;padding:2px 5px;color:#fff;font-family:inherit;font-size:10px}@media(max-width:600px){body{padding:8px}.shell{padding:11px;border-radius:19px}h1{font-size:21px}.mark{width:36px;height:36px}.hud{grid-template-columns:1fr 1fr}.stat:nth-child(4){display:none}.hint{font-size:11px}}
</style></head><body><main class="shell"><header><div class="brand"><div class="mark">🎣</div><div><p class="eyebrow">Northern waters collection</p><h1>Lighthouse Angler</h1></div></div><a class="hub" href="arcade-launcher.html">← Game Hub</a></header><div class="stage"><canvas id="game" width="920" height="560" aria-label="Lighthouse Angler fishing game"></canvas></div><section class="hud"><div class="stat"><label>Water</label><b id="water">Golden Harbor</b></div><div class="stat"><label>Catch</label><b id="catch">0 / 4</b></div><div class="stat"><label>Keeper score</label><b id="score">0</b></div><div class="stat"><label>Line</label><b id="line">Ready</b></div></section><p class="hint"><kbd>←</kbd> <kbd>→</kbd> move along the shore · <kbd>Space</kbd> cast / reel · wait for a bite · <kbd>Esc</kbd> Game Hub</p></main><script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height,bg=new Image();bg.src='lighthouse-angler-lake.png';const fishArt={trout:new Image(),bass:new Image(),perch:new Image()};fishArt.trout.src='lighthouse-fish-trout.png';fishArt.bass.src='lighthouse-fish-bass.png';fishArt.perch.src='lighthouse-fish-perch.png';const $=q=>document.querySelector(q);let keys={},last=0,mode='intro',level=0,score=0,caught=0,line=null,fish=[],ripples=[],sparks=[],notice='',noticeT=0;let angler={x:W*.5};const waters=[['Golden Harbor',4,'#ffd179'],['Starlight Inlet',5,'#9cbcff'],['Silver Dawn',6,'#c4fff0']];
function tone(f,d=.1,type='sine',v=.04){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function reset(all=false){if(all){level=0;score=0;}caught=0;line=null;fish=[];ripples=[];sparks=[];mode='play';notice='Find a calm spot and cast.';noticeT=3;fillFish();sync();tone(330,.12,'triangle')}
function fillFish(){for(let i=0;i<7+level*2;i++)fish.push({x:90+Math.random()*740,y:245+Math.random()*210,v:(Math.random()<.5?-1:1)*(20+Math.random()*35),r:12+Math.random()*11,kind:['trout','bass','perch'][i%3],phase:Math.random()*7,bitten:false})}
function sync(){let w=waters[level];$('#water').textContent=w[0];$('#catch').textContent=caught+' / '+w[1];$('#score').textContent=score.toLocaleString();$('#line').textContent=!line?'Ready':line.state==='casting'?'Casting':line.fish?'FISH ON!':'Drifting'}
function cover(im){let s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h)}
function cast(){if(mode==='intro'||mode==='over'||mode==='win'){reset(mode!=='over');return}if(mode!=='play')return;if(!line){line={x:angler.x,y:160,vy:260,state:'casting',fish:null,wait:0};notice='Line is out — wait for a bite.';noticeT=2;tone(230,.08,'sine')}else if(line.state==='drift'){line.state='reel';notice=line.fish?'Reel it in!':'Reeling the line.';noticeT=1.2;tone(line.fish?550:280,.08,'triangle')}else if(line.state==='casting'){line.state='reel'}}
function tick(t){let dt=Math.min(.033,(t-last||16)/1000);last=t;if(mode==='play'){let mv=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0);angler.x=Math.max(70,Math.min(W-70,angler.x+mv*250*dt));fish.forEach(f=>{f.x+=f.v*dt;f.phase+=dt*3;if(f.x<55||f.x>W-55)f.v*=-1});if(line){line.x+=(angler.x-line.x)*.7*dt;if(line.state==='casting'){line.y+=line.vy*dt;if(line.y>460){line.y=460;line.state='drift';ripples.push({x:line.x,y:line.y,r:3,l:1})}}else if(line.state==='drift'){line.wait+=dt;if(!line.fish&&(Math.random()<dt*(.32+level*.1)||line.wait>1.55)){let choices=fish.filter(f=>Math.hypot(f.x-line.x,f.y-line.y)<115);let choice=choices[0]||fish.reduce((best,f)=>!best||Math.hypot(f.x-line.x,f.y-line.y)<Math.hypot(best.x-line.x,best.y-line.y)?f:best,null);if(choice){line.fish=choice;line.fish.x=line.x;line.fish.y=line.y;line.fish.bitten=true;notice='BITE! Press Space to reel.';noticeT=4;tone(610,.15,'sine',.07)}}}else if(line.state==='reel'){line.y-=325*dt;if(line.fish){line.fish.x=line.x+Math.sin(t*.015)*12;line.fish.y=line.y+18}if(line.y<145){if(line.fish){caught++;score+=Math.round(140+line.fish.r*15+level*80);sparks.push({x:line.x,y:150,l:1.3});notice=line.fish.kind.toUpperCase()+' LANDED!';noticeT=2;tone(740,.18,'triangle',.08);fish=fish.filter(f=>f!==line.fish);if(caught>=waters[level][1]){if(level<waters.length-1){level++;mode='between';notice=waters[level][0]+' is calling.';noticeT=3;setTimeout(()=>{if(mode==='between'){caught=0;line=null;fish=[];fillFish();mode='play';sync()}},1700)}else{mode='win';notice='Every water mastered.';noticeT=5}}}line=null}}if(line)ripples.push({x:line.x,y:line.y,r:2,l:.5})}ripples.forEach(r=>{r.r+=44*dt;r.l-=dt});ripples=ripples.filter(r=>r.l>0);sparks.forEach(s=>s.l-=dt);sparks=sparks.filter(s=>s.l>0);noticeT=Math.max(0,noticeT-dt);sync()}draw(t);requestAnimationFrame(tick)}
function fishDraw(f){x.save();x.translate(f.x,f.y);x.scale(f.v>0?1:-1,1);x.translate(0,Math.sin(f.phase)*3);x.shadowColor='#00131d';x.shadowBlur=10;let art=fishArt[f.kind],h=f.r*2.45,w=h*(art.width/art.height||2.4);if(art.complete&&art.naturalWidth){x.drawImage(art,-w/2,-h/2,w,h)}else{x.fillStyle=f.kind==='trout'?'#d3916a':f.kind==='bass'?'#718e4a':'#e4b660';x.beginPath();x.ellipse(0,0,f.r*1.55,f.r*.62,0,0,7);x.fill()}x.restore()}
function draw(t){x.clearRect(0,0,W,H);if(bg.complete)cover(bg);else{x.fillStyle='#12445d';x.fillRect(0,0,W,H)}if(level===1){x.fillStyle='#10235d55';x.fillRect(0,0,W,H)}if(level===2){x.fillStyle='#9effd014';x.fillRect(0,0,W,H)}x.save();x.globalAlpha=.2;x.strokeStyle='#dbf8ff';x.lineWidth=1;for(let yy=210;yy<H;yy+=18){x.beginPath();x.moveTo(0,yy+Math.sin(t*.001+yy)*3);x.bezierCurveTo(W*.3,yy-8,W*.7,yy+8,W,yy+Math.sin(t*.001+yy)*3);x.stroke()}x.restore();fish.forEach(fishDraw);ripples.forEach(r=>{x.strokeStyle='#d9fbff';x.globalAlpha=r.l*.8;x.lineWidth=2;x.beginPath();x.ellipse(r.x,r.y,r.r,r.r*.32,0,0,7);x.stroke();x.globalAlpha=1});let shoreY=138;x.save();x.strokeStyle='#e7d3aa';x.lineWidth=4;x.beginPath();x.moveTo(angler.x,shoreY);if(line){x.lineTo(line.x,line.y);x.fillStyle=line.fish?'#ffdd73':'#f8fbff';x.beginPath();x.arc(line.x,line.y,5,0,7);x.fill()}else{x.lineTo(angler.x+50,300)}x.stroke();x.restore();x.fillStyle='#111d1e';x.beginPath();x.ellipse(angler.x,shoreY+12,38,13,0,0,7);x.fill();x.fillStyle='#d7a56d';x.beginPath();x.arc(angler.x,shoreY-7,11,0,7);x.fill();x.fillStyle='#19314b';x.beginPath();x.roundRect(angler.x-16,shoreY+1,32,24,9);x.fill();x.fillStyle='#d8ebf1';x.font='700 11px -apple-system';x.fillText('NICK',angler.x-15,shoreY+45);sparks.forEach(s=>{x.fillStyle='#fff4b1';x.globalAlpha=s.l;x.beginPath();x.arc(s.x+(1-s.l)*20,s.y-(1-s.l)*35,4,0,7);x.fill();x.globalAlpha=1});let g=x.createLinearGradient(0,H*.65,0,H);g.addColorStop(0,'transparent');g.addColorStop(1,'#00111896');x.fillStyle=g;x.fillRect(0,0,W,H);if(mode!=='play'){x.fillStyle='#041019a8';x.fillRect(0,0,W,H);let title=mode==='intro'?'LIGHTHOUSE ANGLER':mode==='over'?'THE ONE THAT GOT AWAY':mode==='win'?'MASTER ANGLER':mode==='between'?'NEW WATER UNLOCKED':'';let sub=mode==='intro'?'Press Space or click the lake to begin':mode==='over'?'Press Space for another cast':mode==='win'?'Three waters, every keeper landed.':notice;x.textAlign='center';x.fillStyle='#f4fbff';x.font='900 40px -apple-system';x.fillText(title,W/2,H/2-16);x.fillStyle='#bce5f2';x.font='600 16px -apple-system';x.fillText(sub,W/2,H/2+22);x.textAlign='left'}else if(noticeT){x.textAlign='center';x.fillStyle='#061621c9';x.roundRect(W/2-165,38,330,38,19);x.fill();x.fillStyle='#f4fbff';x.font='700 14px -apple-system';x.fillText(notice,W/2,62);x.textAlign='left'}}
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' ')cast();if(e.key==='Escape')location.href='arcade-launcher.html'});addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('click',cast);requestAnimationFrame(tick)})();
</script></body></html>
