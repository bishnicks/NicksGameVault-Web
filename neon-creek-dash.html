function start(){score=0;level=mapIndex+1;lives=3;previousMapIndex=mapIndex;mapTransition=0;setupLevel();mode='play';startBtn.textContent='Restart Dash';tone(330,.14,'sine',.04,120);tone(495,.09,'triangle',.018,60)}

function die(reason){if(player.inv>0)return;lives--;tone(145,.24,'sine',.055,-85);burst(player.displayX,player.displayY,'#b8d8e6',24);if(lives<=0){mode='over';if(score>best){best=score;try{localStorage.setItem('neonCreekBest',best)}catch(_){}}statusEl.textContent='The creek grows quiet — press R or Begin Dash';updateHud();return}statusEl.textContent=reason;restartLife();updateHud()}
function burst(px,py,color,n=14){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:rnd(-90,90),vy:rnd(-90,90),life:rnd(.35,.9),size:rnd(1,4),color})}
function hop(dx,dy){if(mode==='title'||mode==='over'){start();return}if(mode!=='play'||hopCooldown>0)return;const currentCol=clamp(Math.round((player.x-58)*8/(W-116)),0,8),nextCol=dx?clamp(currentCol+dx,0,8):currentCol,nextRow=clamp(player.row+dy,0,10);player.col=nextCol;player.row=nextRow;if(dx)player.x=58+nextCol*(W-116)/8;player.y=laneY(nextRow);player.hop=.16;player.dir=dy||dx;player.face=dx?(dx>0?0:Math.PI):(dy<0?-Math.PI/2:Math.PI/2);animalHop();hopCooldown=.105;}
function loopDistance(a,b){const d=Math.abs(a-b)%W;return Math.min(d,W-d)}function collide(a,b){return loopDistance(a.x,b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2}
function scoreAdd(n){score+=n;if(score>best)best=score;updateHud()}
function reachHome(){let home=homes.reduce((nearest,h)=>!h.filled&&(!nearest||Math.abs(player.x-h.x)<Math.abs(player.x-nearest.x))?h:nearest,null);if(!home||Math.abs(player.x-home.x)>66){die('Missed the moon pad');return}home.filled=true;scoreAdd(250);burst(home.x,home.y,'#ffe96f',18);tone(720,.19,'sine',.04,280);if(homes.every(h=>h.filled)){level++;scoreAdd(500);previousMapIndex=mapIndex;mapIndex=(mapIndex+1)%maps.length;mapTransition=1.35;setupLevel();statusEl.textContent=`${maps[mapIndex].name} opens — ${maps[mapIndex].arrival}`;tone(392,.2,'sine',.045,140);tone(587,.28,'triangle',.026,-80)}else{statusEl.textContent='Moon pad lit! Your hero returns to the bank for the next one.';restartLife()}}
function update(dt){beat+=dt;mapTransition=Math.max(0,mapTransition-dt);hopCooldown=Math.max(0,hopCooldown-dt);if(mode==='play'&&!muted){musicTimer-=dt;if(musicTimer<=0){music();musicTimer=.43}}if(mode!=='play')return;objects.forEach(o=>{o.x+=o.dir*o.v*dt;if(o.dir>0&&o.x-o.w/2>W)o.x=-o.w/2;if(o.dir<0&&o.x+o.w/2<0)o.x=W+o.w/2});player.displayX+=(player.x-player.displayX)*Math.min(1,dt*15);player.displayY+=(player.y-player.displayY)*Math.min(1,dt*15);player.hop=Math.max(0,player.hop-dt);player.inv=Math.max(0,player.inv-dt);if(player.row===0){reachHome();return}if(player.row>=2&&player.row<=4){let ride=objects.find(o=>o.row===player.row&&loopDistance(player.x,o.x)<o.w/2+(/lily/i.test(o.type)?16:4));if(!ride){die('Splash! Find a log or lily pad.');return}player.x+=ride.dir*ride.v*dt;if(player.x<0){player.x+=W;player.displayX=player.x}else if(player.x>W){player.x-=W;player.displayX=player.x}}else if(player.row>=6&&player.row<=8){if(objects.some(o=>o.row===player.row&&loopDistance(player.x,o.x)<o.w/2-10)){die('Watch the creek critters!');return}}fireflies.forEach(f=>{if(!f.taken&&Math.hypot(player.x-f.x,player.y-f.y)<24){f.taken=true;scoreAdd(45);burst(f.x,f.y,'#eaff82',10);tone(820,.08,'sine',.032,130)}});particles=particles.filter(p=>(p.life-=dt)>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=26*dt});}
function cover(img,opacity=1){if(!img.complete||!img.naturalWidth)return;const s=Math.max(W/img.naturalWidth,H/img.naturalHeight);const iw=img.naturalWidth*s,ih=img.naturalHeight*s;x.globalAlpha=.92*opacity;x.drawImage(img,(W-iw)/2,(H-ih)/2,iw,ih);x.globalAlpha=1}
function glow(col,b=12){x.shadowColor=col;x.shadowBlur=b}function rr(px,py,w,h,r){x.beginPath();x.roundRect(px-w/2,py-h/2,w,h,r)}
function drawBackdrop(){const profile=maps[mapIndex],route=routeBook[mapIndex],waterColors=profile.water;x.fillStyle='#05100e';x.fillRect(0,0,W,H);cover(profile.world);if(mapTransition>0)cover(maps[previousMapIndex].world,mapTransition/1.35);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03120824');g.addColorStop(.42,route.bank+'3d');g.addColorStop(1,'#01050381');x.fillStyle=g;x.fillRect(0,0,W,H);for(const row of [1,5,9,10]){const y=laneY(row);x.fillStyle=row===1?route.bank+'bf':route.bank+'8c';x.fillRect(20,y-22,W-40,44);x.fillStyle=route.edge+'32';x.fillRect(20,y+17,W-40,1)}for(const row of [2,3,4]){const y=laneY(row),water=x.createLinearGradient(0,y-23,0,y+23);water.addColorStop(0,waterColors[0]);water.addColorStop(.48,waterColors[1]);water.addColorStop(1,waterColors[2]);x.fillStyle=water;x.fillRect(20,y-23,W-40,46);x.save();x.beginPath();x.rect(20,y-22,W-40,44);x.clip();x.globalCompositeOperation='screen';x.lineWidth=1;for(let i=0;i<8;i++){const yy=y-18+i*5.5,off=Math.sin(beat*1.65+i*1.7+row)*26;x.strokeStyle=`rgba(201,229,222,${.055+(i%3)*.025})`;x.beginPath();x.moveTo(26+off,yy);x.bezierCurveTo(W*.28+off,yy-4,W*.62-off,yy+4,W-26+off,yy);x.stroke()}x.restore()}for(const row of [6,7,8]){const y=laneY(row);x.fillStyle=route.bank+'99';x.fillRect(20,y-22,W-40,44);x.fillStyle=route.edge+'24';x.fillRect(20,y-20,W-40,1)}x.save();x.fillStyle='#020705b8';rr(135,22,226,23,11);x.fill();x.strokeStyle=route.edge+'a0';x.lineWidth=1;x.stroke();x.fillStyle=route.edge;x.font='700 9px -apple-system';x.textAlign='center';x.fillText(route.tag,135,25);x.restore()}
function drawHome(h){x.save();const p=.5+.5*Math.sin(beat*2+h.pulse);glow(h.filled?'#f2d17a':'#91bc75',h.filled?14:5);x.fillStyle=h.filled?'#c7a754':'#365f3c';rr(h.x,h.y,112,32,16);x.fill();x.strokeStyle=h.filled?'#f7df98':'#a4c884';x.lineWidth=2;x.stroke();if(h.filled){x.fillStyle='#fff0b0';x.beginPath();x.arc(h.x,h.y,5+p*2,0,Math.PI*2);x.fill()}else{x.fillStyle='#d5e79b';x.globalAlpha=.35+p*.2;x.beginPath();x.arc(h.x,h.y,3.5,0,Math.PI*2);x.fill()}x.restore()}

 const t=o.type,drift=Math.sin(beat*1.4+o.phase)*1.3,platform=o.safe;

 }else if(/lily/i.test(t)){
  const bob=Math.sin(beat*2+o.phase)*1.2;if(t==='lily'&&lilyArt.complete&&lilyArt.naturalWidth){x.save();x.rotate(Math.sin(beat*.9+o.phase)*.018);x.drawImage(lilyArt,-o.w*.57,-o.w*.37,o.w*1.14,o.w*.76);x.restore()}
  else {x.fillStyle='#4f8d4e';x.beginPath();x.ellipse(0,bob,o.w/2,o.h/2,0,0,Math.PI*2);x.fill();x.fillStyle='#b9d36a';x.beginPath();x.arc(o.w*.08,bob-2,7,0,Math.PI*2);x.fill();x.fillStyle='#f3df9c';x.beginPath();x.arc(o.w*.08,bob-2,3,0,Math.PI*2);x.fill()}
 }else if(t==='riverStone'||t==='stoneShelf'){
  x.fillStyle=t==='riverStone'?'#6c9294':'#75857b';x.beginPath();x.moveTo(-o.w*.5,8);x.lineTo(-o.w*.38,-10);x.lineTo(-o.w*.08,-17);x.lineTo(o.w*.36,-11);x.lineTo(o.w*.5,8);x.closePath();x.fill();x.strokeStyle='#d7eee955';x.lineWidth=2;x.stroke();x.fillStyle='#253e3c';x.beginPath();x.ellipse(-o.w*.1,-5,o.w*.17,5,0,0,Math.PI*2);x.fill();
 }else if(t==='reedMat'){
  x.fillStyle='#857442';rr(0,3,o.w,o.h*.55,12);x.fill();for(let i=-.42;i<=.42;i+=.12){x.strokeStyle=i%2?'#d4bd62':'#6d923f';x.lineWidth=3;x.beginPath();x.moveTo(i*o.w,7);x.quadraticCurveTo(i*o.w+5,-25,i*o.w+2,-38);x.stroke()}
 }else if(t==='mushroomCap'){
  for(let i=-.28;i<=.28;i+=.28){x.fillStyle='#e7d6a5';rr(i*o.w,8,12,22,6);x.fill();x.fillStyle=i===0?'#bd5c4c':'#c9855a';x.beginPath();x.arc(i*o.w,-2,18,Math.PI,0);x.fill();x.fillStyle='#ffe8b0';x.beginPath();x.arc(i*o.w-5,-7,2.4,0,Math.PI*2);x.fill()}
 }else if(/Raft|Pier|Debris|Dam/i.test(t)){
  const plank=t==='brokenPier'?'#43505a':t==='stormDebris'?'#5c4835':t==='beaverDam'?'#71512d':t==='leafRaft'?'#913c1f':'#a77742';x.fillStyle=plank;rr(0,0,o.w,o.h,8);x.fill();x.strokeStyle='#1e150e99';x.lineWidth=2;for(let i=-.36;i<=.36;i+=.18){x.beginPath();x.moveTo(i*o.w,-o.h*.43);x.lineTo(i*o.w,o.h*.43);x.stroke()}if(t==='leafRaft'){x.fillStyle='#f0a13f';for(let i=-.25;i<=.25;i+=.22){x.beginPath();x.ellipse(i*o.w,-4,11,5,.45,0,Math.PI*2);x.fill()}}
 }else if(t==='iceFloe'){
  x.fillStyle='#c4edfa';x.beginPath();x.moveTo(-o.w*.5,5);x.lineTo(-o.w*.25,-13);x.lineTo(o.w*.27,-16);x.lineTo(o.w*.5,3);x.lineTo(o.w*.18,13);x.lineTo(-o.w*.34,12);x.closePath();x.fill();x.strokeStyle='#efffff';x.lineWidth=2;x.stroke();x.fillStyle='#6aa6bd';x.globalAlpha=.6;x.fillRect(-o.w*.32,7,o.w*.58,4);x.globalAlpha=1;
 }else if(t==='turtle'){
  x.fillStyle='#243b25';x.beginPath();x.ellipse(0,1,o.w/2,15,0,0,Math.PI*2);x.fill();x.fillStyle='#5d793e';x.beginPath();x.ellipse(-o.w*.1,-5,o.w*.27,12,0,0,Math.PI*2);x.fill();x.fillStyle='#bdca8b';x.beginPath();x.arc(o.w*.38,-5,5,0,Math.PI*2);x.fill();
 }else{
  if(o.dir<0)x.scale(-1,1);
  if(/trout|eel|waterSnake|salamander/i.test(t)){const fish=/trout|eel/i.test(t);x.strokeStyle=fish?(t==='eel'?'#8dbe81':'#da9a55'):'#709957';x.lineWidth=fish?12:10;x.lineCap='round';x.beginPath();x.moveTo(-o.w*.35,4);x.quadraticCurveTo(-o.w*.06,-12,o.w*.3,0);x.stroke();x.fillStyle=fish?(t==='eel'?'#ccde98':'#e6ae65'):'#90b269';x.beginPath();x.ellipse(o.w*.2,0,14,8,0,0,Math.PI*2);x.fill();x.fillStyle='#111';x.beginPath();x.arc(o.w*.3,-2,1.8,0,Math.PI*2);x.fill();
  }else if(/heron|crane|raven|owl/i.test(t)){x.fillStyle=t==='raven'?'#202838':t==='owlShadow'?'#303846':'#d7d7bf';x.beginPath();x.ellipse(0,3,18,10,0,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(-8,1);x.lineTo(-25,-12);x.lineTo(-4,-5);x.closePath();x.fill();x.fillStyle='#e6b952';x.fillRect(15,0,9,3);x.strokeStyle='#b6a06e';x.lineWidth=3;x.beginPath();x.moveTo(0,10);x.lineTo(-4,20);x.moveTo(6,10);x.lineTo(2,20);x.stroke();
  }else if(t==='dragonflySwarm'){for(let i=-.3;i<=.3;i+=.2){x.fillStyle='#90d8f2aa';x.beginPath();x.ellipse(i*o.w,-5,12,4,.3,0,Math.PI*2);x.fill();x.fillStyle='#23384b';x.fillRect(i*o.w-2,-3,4,13)}
  }else{const fur=/wolf/i.test(t)?'#aab7be':/snowHare/i.test(t)?'#f4f2e8':/mountainGoat/i.test(t)?'#d6c4a2':/fox/i.test(t)?'#c76b37':/deer/i.test(t)?'#b98252':/boar/i.test(t)?'#694330':/hedgehog/i.test(t)?'#6b5140':/squirrel/i.test(t)?'#9f6437':'#5d4934';x.fillStyle=fur;x.beginPath();x.ellipse(0,3,o.w*.32,12,0,0,Math.PI*2);x.fill();x.beginPath();x.arc(o.w*.25,-4,10,0,Math.PI*2);x.fill();x.fillStyle='#17130f';x.beginPath();x.arc(o.w*.34,-6,1.8,0,Math.PI*2);x.fill();x.fillStyle=fur;x.beginPath();x.moveTo(o.w*.2,-10);x.lineTo(o.w*.25,-20);x.lineTo(o.w*.32,-10);x.fill();x.beginPath();x.moveTo(o.w*.37,-10);x.lineTo(o.w*.43,-19);x.lineTo(o.w*.47,-8);x.fill();}
 }
 x.restore()
}
function drawFirefly(f){if(f.taken)return;const p=.55+.45*Math.sin(beat*3+f.phase),rise=Math.sin(beat*.7+f.phase)*5;x.save();x.globalCompositeOperation='screen';glow('#f7d875',13);x.fillStyle=`rgba(255,223,107,${.28+p*.62})`;x.beginPath();x.arc(f.x,f.y+rise,1.8+p*1.8,0,Math.PI*2);x.fill();x.globalAlpha=.16+p*.12;x.beginPath();x.arc(f.x,f.y+rise,7+p*5,0,Math.PI*2);x.fill();x.restore()}
function drawPlayer(){if(!player)return;const hero=activeHero(),bob=player.hop>0?-Math.sin((player.hop/.16)*Math.PI)*15:Math.sin(beat*3)*.8;x.save();x.translate(player.displayX,player.displayY+bob);x.save();x.globalAlpha=.34;x.fillStyle='#010503';x.beginPath();x.ellipse(2,22,28,6,0,0,Math.PI*2);x.fill();x.restore();if(player.inv>0&&Math.floor(beat*12)%2===0)x.globalAlpha=.35;glow(hero.tint,8);const facingLeft=Math.abs(Math.abs(player.face)-Math.PI)<.01;if(facingLeft)x.scale(-1,1);else x.rotate(player.face||0);if(hero.art.complete&&hero.art.naturalWidth){x.drawImage(hero.art,-49,-33,98,66)}else{x.fillStyle='#608b46';x.beginPath();x.arc(0,0,19,0,Math.PI*2);x.fill()}x.restore()}
function drawParticles(){x.save();x.globalCompositeOperation='lighter';for(const p of particles){x.globalAlpha=Math.max(0,p.life/.9);glow(p.color,10);x.fillStyle=p.color;x.beginPath();x.arc(p.x,p.y,p.size,0,Math.PI*2);x.fill()}x.restore();x.globalAlpha=1;x.shadowBlur=0}
function overlay(){if(mode==='play')return;const hero=activeHero(),scene=maps[mapIndex],difficulty=activeDifficulty();x.fillStyle='#020907b8';x.fillRect(0,0,W,H);x.textAlign='center';if(mode==='title'){x.fillStyle='#fff9e7';glow('#e1c774',26);x.font='800 53px -apple-system';x.fillText('NEON CREEK DASH',W/2,158);x.shadowBlur=0;x.fillStyle='#d6c483';x.font='700 14px -apple-system';x.fillText('THE WILDLIFE JOURNEY',W/2,190);if(hero.art.complete){x.save();glow(hero.tint,12);x.drawImage(hero.art,W/2-118,213,236,157);x.restore()}x.fillStyle='#f7e2a3';x.font='700 18px -apple-system';x.fillText(`${hero.name.toUpperCase()}  ·  ${hero.kind.toUpperCase()}`,W/2,411);x.fillStyle='#dfe8d6';x.font='15px -apple-system';x.fillText('Press C for hero · M for scene · H for difficulty.',W/2,445);x.fillStyle='#e6eadb';x.font='700 15px -apple-system';x.fillText(`SCENE ${String(mapIndex+1).padStart(2,'0')}  ·  ${scene.name.toUpperCase()}`,W/2,475);x.fillStyle=difficulty.accent;x.font='800 14px -apple-system';x.fillText(`MODE  ·  ${difficulty.name.toUpperCase()}`,W/2,502);x.fillStyle='#f2d789';x.font='700 15px -apple-system';x.fillText('PRESS ENTER OR CLICK BEGIN DASH',W/2,540)}else if(mode==='pause'){x.fillStyle='#f4f0dd';x.font='800 42px -apple-system';x.fillText('THE CREEK WAITS',W/2,290);x.fillStyle='#d5e4b9';x.font='16px -apple-system';x.fillText('Press Space to continue your journey',W/2,328)}else{x.fillStyle='#f4ead9';x.font='800 40px -apple-system';x.fillText('THE NIGHT FALLS QUIET',W/2,270);x.fillStyle='#f3da8e';x.font='700 18px -apple-system';x.fillText(`FINAL SCORE ${fmt(score)}`,W/2,311);x.fillStyle='#d6e4c6';x.font='16px -apple-system';x.fillText('Press C for a hero, M for a scene, H for a mode, then R',W/2,355)}}
function drawCinematicFinish(){x.save();const v=x.createRadialGradient(W*.5,H*.46,H*.25,W*.5,H*.46,H*.78);v.addColorStop(.56,'#00000000');v.addColorStop(1,'#0006038f');x.fillStyle=v;x.fillRect(0,0,W,H);x.globalAlpha=.07;for(let i=0;i<75;i++){const px=(i*193+37)%W,py=(i*97+beat*7)%H;x.fillStyle=i%3?'#eef0d4':'#0d251b';x.fillRect(px,py,1,1)}x.restore()}
function drawMapArrival(){if(!mapTransition)return;const a=Math.min(1,mapTransition*1.8),profile=maps[mapIndex];x.save();x.globalAlpha=a;x.fillStyle='#02080666';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff2c9';glow('#f0c76e',18);x.font='800 36px -apple-system';x.fillText(profile.name.toUpperCase(),W/2,284);x.shadowBlur=0;x.fillStyle='#dbe9cf';x.font='15px -apple-system';x.fillText(profile.arrival,W/2,316);x.restore()}
function draw(){drawBackdrop();homes.forEach(drawHome);objects.forEach(drawObject);fireflies.forEach(drawFirefly);drawPlayer();drawParticles();drawCinematicFinish();drawMapArrival();overlay()}function loop(t){const dt=Math.min(.033,(t-last||0)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const map={ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1]};if(e.key==='Escape'){location.href='arcade-launcher.html';return}if(e.key in map){e.preventDefault();hop(...map[e.key])}if(e.key==='c'||e.key==='C'){e.preventDefault();chooseHero()}if(e.key==='m'||e.key==='M'){e.preventDefault();chooseScene()}if(e.key==='h'||e.key==='H'){e.preventDefault();chooseDifficulty()}if(e.key==='Enter'){e.preventDefault();if(mode!=='play')start()}if(e.key==='r'||e.key==='R')start();if(e.key===' '){e.preventDefault();if(mode==='play'){mode='pause';statusEl.textContent='Paused — press Space to continue'}else if(mode==='pause'){mode='play';statusEl.textContent='Keep dashing!'}}});
arcadeHomeBtn.onclick=()=>location.href='arcade-launcher.html';heroChoiceBtn.onclick=()=>chooseHero();sceneChoiceBtn.onclick=()=>chooseScene();difficultyChoiceBtn.onclick=()=>chooseDifficulty();startBtn.onclick=()=>start();animalSoundBtn.onclick=()=>{animalMuted=!animalMuted;if(animalMuted){activeAnimalCalls.forEach(call=>{call.pause();call.currentTime=0});activeAnimalCalls.clear()}animalSoundBtn.textContent=`Animal calls: ${animalMuted?'off':'on'}`;statusEl.textContent=`Animal calls ${animalMuted?'silenced — music stays on.':'back on.'}`};soundBtn.onclick=()=>{muted=!muted;soundBtn.textContent=`Sound + music: ${muted?'off':'on'}`;if(!muted)tone(560,.08,'sine',.03,50)};setupLevel();updateHud();requestAnimationFrame(loop);setTimeout(()=>c.focus(),300);
document.querySelectorAll('[data-move]').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();const move={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[btn.dataset.move];hop(...move)}));if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
