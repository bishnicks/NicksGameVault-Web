<html lang="en">

<title>Starry</title>
<style>

  button { border:1px solid #b9caff35; border-radius:10px; color:#edf3ff; background:linear-gradient(180deg,#31467c,#1a2855); box-shadow:inset 0 1px 0 #ffffff24,0 4px 9px #05081745; padding:8px 12px; font:600 11px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; cursor:pointer; transition:transform .15s ease,background .15s ease,box-shadow .15s ease; }
  button:hover,button:focus-visible { background:linear-gradient(180deg,#4968aa,#263c76); box-shadow:inset 0 1px 0 #ffffff38,0 7px 15px #05081770; outline:2px solid #92dfff; outline-offset:2px; transform:translateY(-1px); }

  @media (max-width:700px) { body{padding:10px}.cabinet{padding:12px;border-radius:20px} header,.controls{align-items:flex-start;flex-direction:column}.hud{justify-content:flex-start}.character-picker{justify-content:flex-start}.hint{text-align:left} }
  *{-webkit-tap-highlight-color:transparent}.touch-controls{display:none;align-items:center;justify-content:space-between;gap:20px;padding:12px 10px 0}.touch-stick{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px);gap:6px}.touch-stick button{font-size:20px;padding:0;touch-action:none}.touch-stick [data-key="ArrowUp"]{grid-column:2}.touch-stick [data-key="ArrowLeft"]{grid-column:1}.touch-stick [data-key="ArrowDown"]{grid-column:2}.touch-stick [data-key="ArrowRight"]{grid-column:3}.fire-button{width:76px;height:76px;border-radius:50%;font-size:13px;touch-action:none;background:linear-gradient(145deg,#c94682,#6e295f)}
  @media(max-width:700px),(pointer:coarse){html,body{overscroll-behavior:none}body{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));-webkit-user-select:none;user-select:none}.touch-controls{display:flex}canvas{touch-action:none}.character-picker{max-height:82px;overflow:auto}.hud span{padding:4px 6px}.controls{padding-top:8px}}

<body>
<main class="cabinet">
  <header><div class="brand"><img class="app-icon" src="Starry-icon.png" alt=""><div><p class="eyebrow">Cosmic arcade</p><h1>Starry</h1></div></div><div class="hud"><span>SCORE <b id="score">000000</b></span><span>BEST <b id="best">000000</b></span><span>WAVE <b id="wave">01</b></span><span>ENEMIES <b id="enemy-type">FIREFLY SWARM</b></span><span>HULL <b id="lives">◆◆◆</b></span><span>COMPANION <b id="ally-type">DRAGON</b></span></div></header>
  <div class="game-stage"><canvas id="game" width="840" height="620" aria-label="Starry arcade game. Move with arrows or WASD and fire with Space."></canvas></div>
  <div class="touch-controls" aria-label="Touch game controls"><div class="touch-stick"><button data-key="ArrowUp" aria-label="Move up">▲</button><button data-key="ArrowLeft" aria-label="Move left">◀</button><button data-key="ArrowDown" aria-label="Move down">▼</button><button data-key="ArrowRight" aria-label="Move right">▶</button></div><button class="fire-button" data-key=" " aria-label="Fire">FIRE</button></div>
  <div class="character-picker" aria-label="Choose your character"><span>CHOOSE YOUR TRAVELER</span><button class="character-choice selected" data-character="fire" type="button">Fire Dragon</button><button class="character-choice" data-character="sky" type="button">Blue Dragon</button><button class="character-choice" data-character="pegasus" type="button">Sky Pegasus</button><button class="character-choice" data-character="dog" type="button">Cosmic Dog</button><button class="character-choice" data-character="angler" type="button">Braxton Starshot</button><button class="character-choice" data-character="captain" type="button">Red Star Pilot</button><button class="character-choice" data-character="traveler" type="button">Jackie Starbound</button></div>
  <div class="controls"><div class="buttons"><button id="arcade-home" type="button">Game Hub</button><button id="launch" type="button">Begin Journey</button><button id="sound" type="button">Sound + music: on</button></div><div id="status" role="status">Arrow keys / WASD to steer · Space to fire · P to pause · Esc for Game Hub</div><div class="hint">Power-ups: rapid fire · spread shot · shield</div></div>
</main>
<script>
(() => {
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),waveEl=document.getElementById('wave'),livesEl=document.getElementById('lives'),enemyTypeEl=document.getElementById('enemy-type'),allyTypeEl=document.getElementById('ally-type'),statusEl=document.getElementById('status'),arcadeHomeBtn=document.getElementById('arcade-home'),launchBtn=document.getElementById('launch'),soundBtn=document.getElementById('sound'),characterButtons=[...document.querySelectorAll('.character-choice')];
  const W=840,H=620, keys=new Set(),dragonSprite=new Image(),horseSprite=new Image(),bossSprite=new Image(),captainSprite=new Image(),playerDragonSprite=new Image(),dogSprite=new Image(),anglerSprite=new Image(),redPilotSprite=new Image(),cafeTravelerSprite=new Image(),selectorBackground=new Image();
  dragonSprite.src='wingman-dragon.png';
  horseSprite.src='horse-sidekick.png';
  bossSprite.src='void-kraken-overlord.png';
  captainSprite.src='sunlit-captain-boss.png';
  playerDragonSprite.src='player-fire-dragon.png';
  dogSprite.src='cosmic-dog-ranger.png';
  anglerSprite.src='cosmic-angler.png';
  redPilotSprite.src='red-star-pilot.png';
  cafeTravelerSprite.src='star-cafe-traveler.png';
  selectorBackground.src='selector-atmosphere.png';
  let state='title',score=0,best=0,wave=1,lives=3,player,dragon,bullets=[],enemyBullets=[],enemies=[],powerups=[],particles=[],stars=[],formation,boss=null,waveTimer=0,last=0,shake=0,muted=false,audio=null,shotTimer=0,enemyFireTimer=0,musicTimer=0,musicStep=0,selectedCharacter='fire';
  try { best=Number(localStorage.getItem('starSwarmBest')||0); } catch (_) {}
  try { const savedCharacter=localStorage.getItem('starSwarmCharacter');if(['fire','sky','pegasus','dog','angler','captain','traveler'].includes(savedCharacter))selectedCharacter=savedCharacter; } catch (_) {}
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const rand=(a,b)=>a+Math.random()*(b-a);
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  function initStars(){stars=Array.from({length:155},()=>({x:Math.random()*W,y:Math.random()*H,z:rand(.2,1.6),h:Math.random()>.86?rand(185,280):rand(185,225)}));}
  function updateCharacterPicker(){characterButtons.forEach(button=>button.classList.toggle('selected',button.dataset.character===selectedCharacter));}
  function characterName(character){return {fire:'Fire Dragon',sky:'Blue Dragon',pegasus:'Sky Pegasus',dog:'Cosmic Dog',angler:'Braxton Starshot',captain:'Red Star Pilot',traveler:'Jackie Starbound'}[character]||'Fire Dragon';}
  function selectCharacter(character){selectedCharacter=character;try{localStorage.setItem('starSwarmCharacter',character)}catch(_){}updateCharacterPicker();if(state==='playing')statusEl.textContent=`${characterName(character)} selected`;}
  function sound(freq=.1,dur=.07,type='sine',vol=.025,slide=0){ if(muted)return; try{audio ||= new (window.AudioContext||window.webkitAudioContext)(); const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur);}catch(_){}}
  function musicBeat(){const melody=[440,523,622,659,622,523,466,0,440,554,659,740,659,554,494,0,415,494,587,698,587,494,440,0,466,554,659,784,740,622,523,0],bass=[55,62,73,65,55,69,62,49];const note=melody[musicStep%melody.length];if(note){sound(note,.17,'sine',.018,18);sound(note*1.5,.10,'triangle',.006,-8);}if(musicStep%4===0)sound(bass[Math.floor(musicStep/4)%bass.length],.28,'triangle',.020,4);musicStep++;}
  function makePlayer(){player={x:W/2,y:H-70,r:12,rapid:0,spread:0,shield:0,inv:0};dragon={x:W/2+72,y:H-120,r:25,fire:.4,guard:0,phase:0};}
  function updateHud(){scoreEl.textContent=String(score).padStart(6,'0');bestEl.textContent=String(best).padStart(6,'0');waveEl.textContent=String(wave).padStart(2,'0');livesEl.textContent='◆'.repeat(lives)||'—';enemyTypeEl.textContent=(boss?boss.name:swarmCreature(wave).name).toUpperCase();allyTypeEl.textContent=wave%2===0?'HORSE':'DRAGON';}
  function addScore(n){score+=n;if(score>best){best=score;try{localStorage.setItem('starSwarmBest',best)}catch(_){}}updateHud();}
  function swarmCreature(number){
    if(number===5)return {kind:'hummingbird',name:'hummingbird flock'};
    const creatures=[
      {kind:'firefly',name:'firefly swarm'},
      {kind:'scarab',name:'neon scarab squad'},
      {kind:'bat',name:'moon bat cloud'},
      {kind:'moth',name:'starlight moth cloud'},
      {kind:'jellyfish',name:'space jellyfish drift'},
      {kind:'goat',name:'cosmic goat herd'},
      {kind:'gecko',name:'comet gecko pack'},
      {kind:'owl',name:'night owl patrol'}
    ];return creatures[(number-(number>5?2:1))%creatures.length];
  }
  function spawnFormation(){
    enemies=[]; boss=null;
    const rows=Math.min(5,3+Math.floor((wave-1)/2)),cols=7;
    const creature=swarmCreature(wave);
    formation={x:120,y:85,dir:1,drop:0,speed:18+wave*2,cols,rows};
    for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
      const type=row===0?'sentinel':row===1?'wasp':'drone';
      const hp=type==='sentinel'?2:1;
      enemies.push({row,col,type,hp,maxHp:hp,kind:creature.kind,variant:(row*3+col)%4,state:'formation',x:0,y:0,homeX:0,homeY:0,dive:0,diveSide:Math.random()<.5?-1:1,fire:rand(1.3,3.0),dead:false});
    }
    updateHud();
    statusEl.textContent=`Wave ${wave}: ${creature.name} incoming — ${wave%2===0?'horse':'dragon'} sidekick ready`;
  }
  function spawnBoss(){
    const firstBoss=wave===3,hp=firstBoss?82:56+wave*14;
    boss={x:W/2,y:105,r:60,hp,maxHp:hp,dir:1,fire:1.1,phase:0,kind:firstBoss?'captain':'kraken',name:firstBoss?'Sunlit Captain':'Void Kraken Overlord'};
    updateHud();
    statusEl.textContent=`WARNING: ${boss.name.toUpperCase()} DETECTED — ${wave%2===0?'horse':'dragon'} sidekick ready`; sound(firstBoss?180:92,.34,'sawtooth',.07,120);
  }
  function resetGame(){score=0;wave=1;lives=3;bullets=[];enemyBullets=[];powerups=[];particles=[];musicTimer=0;musicStep=0;makePlayer();spawnFormation();state='playing';launchBtn.textContent='Restart journey';updateHud();sound(300,.12,'square',.045,360);}
  function fire(){
    if(state!=='playing'||shotTimer>0)return;
    const rapid=player.rapid>0,spread=player.spread>0;shotTimer=rapid?.095:.19;
    bullets.push({x:player.x,y:player.y-50,vx:0,vy:-515,r:6,damage:1,flame:true,playerFlame:true});
    if(spread){bullets.push({x:player.x-10,y:player.y-45,vx:-145,vy:-485,r:5,damage:1,flame:true,playerFlame:true});bullets.push({x:player.x+10,y:player.y-45,vx:145,vy:-485,r:5,damage:1,flame:true,playerFlame:true});}
    burst(player.x,player.y-48,'#ff9b41',3,55);sound(rapid?390:320,.06,'sawtooth',.025,rapid?150:100);
  }
  function enemyShoot(e,aim=true){const dx=player.x-e.x,dy=player.y-e.y,len=Math.max(1,Math.hypot(dx,dy)),speed=aim?160+wave*5:138;enemyBullets.push({x:e.x,y:e.y+18,vx:aim?dx/len*speed:0,vy:aim?dy/len*speed:speed,r:5,hostile:true});sound(175,.07,'triangle',.012,-45);}
  function dragonTarget(){if(boss)return boss;let target=null,bestDistance=Infinity;for(const e of enemies)if(!e.dead){const d=Math.hypot(e.x-dragon.x,e.y-dragon.y);if(d<bestDistance){bestDistance=d;target=e;}}return target;}
  function updateDragon(dt){
    if(!dragon)return;
    dragon.phase+=dt;dragon.guard=Math.max(0,dragon.guard-dt);
    let reward=null,rewardDistance=Infinity;for(const p of powerups)if(!p.dead){const d=dist(p,dragon);if(d<rewardDistance){rewardDistance=d;reward=p;}}
    const targetX=reward?clamp(reward.x,52,W-52):clamp(player.x+60+Math.sin(dragon.phase*1.7)*42,52,W-52),targetY=reward?clamp(reward.y,150,H-58):clamp(player.y-68+Math.cos(dragon.phase*2.3)*13,150,H-58);
    const followSpeed=reward?7:5;dragon.x+=(targetX-dragon.x)*Math.min(1,dt*followSpeed);dragon.y+=(targetY-dragon.y)*Math.min(1,dt*followSpeed);
    dragon.fire-=dt;const target=dragonTarget();
    if(target&&dragon.fire<=0){const dx=target.x-dragon.x,dy=target.y-dragon.y,len=Math.max(1,Math.hypot(dx,dy)),speed=475,ux=dx/len,uy=dy/len;for(const angle of [-.16,0,.16]){const c=Math.cos(angle),s=Math.sin(angle),vx=(ux*c-uy*s)*speed,vy=(ux*s+uy*c)*speed;bullets.push({x:dragon.x,y:dragon.y-28,vx,vy,r:5,damage:.95,dragon:true,flame:true});}dragon.fire=.58;burst(dragon.x,dragon.y-28,'#ffb14d',5,70);sound(295,.09,'sawtooth',.025,150);}
  }
  function burst(x,y,color,count=18,speed=210){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=rand(speed*.25,speed);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.8),max:1,color,size:rand(1.5,4)});}}
  function killEnemy(e){if(e.dead)return;e.dead=true;addScore(e.type==='sentinel'?120:e.type==='wasp'?80:60);const colors={firefly:['#7fffe3','#ffd96b','#ff95d7','#9bb3ff'],hummingbird:['#40e8ff','#ff5f83','#8fff59','#ffc94e'],scarab:['#7fe7ff','#65e1a2','#ef8cff','#ffc94e'],bat:['#bda1ff','#ff77c8','#73eaff','#ffbf70'],moth:['#ffe78a','#ffa0d7','#9affec','#b7a5ff'],jellyfish:['#70f5ff','#a891ff','#ff8ec9','#9eff78'],goat:['#e8f6ff','#ffbfdd','#c5a2ff','#ffe498'],gecko:['#58f6a2','#69d7ff','#ffd866','#ff8e86'],owl:['#c8a0ff','#8edfff','#ffcc75','#f3a0cf']}[e.kind]||['#b6f8ff'];burst(e.x,e.y,colors[e.variant||0],22);sound(100,.14,'sawtooth',.045,220);shake=Math.max(shake,5);if(Math.random()<.22)powerups.push({x:e.x,y:e.y,vy:70,type:['rapid','spread','shield'][Math.floor(Math.random()*3)],r:13,spin:0});}
  function hurtPlayer(){if(player.inv>0)return;if(player.shield>0){player.shield=0;player.inv=.55;burst(player.x,player.y,'#8bffff',18);sound(220,.14,'triangle',.05,-100);return;}lives--;updateHud();burst(player.x,player.y,'#fff3ad',35,260);sound(85,.4,'sawtooth',.07,-55);shake=14;player.inv=2.1;if(lives<=0){state='gameover';statusEl.textContent='Journey paused. Begin again when ready.';launchBtn.textContent='Begin again';}else{player.x=W/2;player.y=H-70;statusEl.textContent=`Hull breached — ${lives} ship${lives===1?'':'s'} remaining`;}}
  function collectPower(p,fromDragon=false){const prefix=fromDragon?'DRAGON DELIVERED — ':'';if(p.type==='rapid'){player.rapid=9;statusEl.textContent=prefix+'RAPID FIRE ONLINE';sound(660,.12,'square',.04,240);}if(p.type==='spread'){player.spread=10;statusEl.textContent=prefix+'TRI-SHOT ONLINE';sound(530,.14,'triangle',.045,180);}if(p.type==='shield'){player.shield=12;statusEl.textContent=prefix+'SHIELD DEPLOYED';sound(330,.16,'sine',.055,200);}addScore(25);burst(p.x,p.y,p.type==='shield'?'#86ffff':p.type==='rapid'?'#ffe079':'#fa89ff',14,150);}
  function formationPosition(e){e.homeX=formation.x+e.col*100;e.homeY=formation.y+e.row*54;if(e.state==='formation'){e.x=e.homeX;e.y=e.homeY;}else{const t=e.dive; e.x=e.homeX+Math.sin(t*Math.PI)*e.diveSide*(100+160*Math.sin(t*Math.PI));e.y=e.homeY+t*620;}}
  function update(dt){
    stars.forEach(s=>{s.y+=s.z*36*dt;if(s.y>H){s.y=0;s.x=Math.random()*W;}});
    if(state!=='playing')return;
    shotTimer=Math.max(0,shotTimer-dt);player.rapid=Math.max(0,player.rapid-dt);player.spread=Math.max(0,player.spread-dt);player.shield=Math.max(0,player.shield-dt);player.inv=Math.max(0,player.inv-dt);shake=Math.max(0,shake-dt*26);
    musicTimer+=dt;while(musicTimer>.22){musicTimer-=.22;musicBeat();}
    let mx=(keys.has('ArrowRight')||keys.has('d')||keys.has('D')?1:0)-(keys.has('ArrowLeft')||keys.has('a')||keys.has('A')?1:0);let my=(keys.has('ArrowDown')||keys.has('s')||keys.has('S')?1:0)-(keys.has('ArrowUp')||keys.has('w')||keys.has('W')?1:0);if(mx||my){const l=Math.hypot(mx,my);player.x=clamp(player.x+mx/l*350*dt,28,W-28);player.y=clamp(player.y+my/l*350*dt,245,H-36);}if(keys.has(' ')||keys.has('Enter'))fire();
    if(boss){updateBoss(dt);}else{updateSwarm(dt);}updateDragon(dt);
    bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});bullets=bullets.filter(b=>b.y>-35&&b.x>-35&&b.x<W+35);
    enemyBullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});enemyBullets=enemyBullets.filter(b=>b.y<H+35&&b.x>-35&&b.x<W+35);
    powerups.forEach(p=>{p.y+=p.vy*dt;p.spin+=dt*5;});powerups=powerups.filter(p=>p.y<H+30);
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt;});particles=particles.filter(p=>p.life>0);
    collisions();
  }
  function updateSwarm(dt){

      const side=i%2?1:-1,row=Math.floor(i/2),wave=Math.sin(boss.phase*(4.1+row*.25)+i*1.63),curl=Math.cos(boss.phase*(5.3+row*.18)+i*.9);
      const x0=side*(17+row*8),y0=10+row*12,x1=side*(50+row*18)+wave*12,y1=27+row*21+curl*9,x2=side*(76+row*17)-wave*10,y2=49+row*20+curl*12;
      ctx.strokeStyle='#241044';ctx.lineWidth=16-row*.65;glow('#4728a7',15);ctx.beginPath();ctx.moveTo(x0,y0);ctx.bezierCurveTo(x1,y0-19-wave*6,x1,y1,x2,y2);ctx.stroke();
      ctx.strokeStyle='#5832b6';ctx.lineWidth=10-row*.45;glow('#774dff',13);ctx.beginPath();ctx.moveTo(x0,y0);ctx.bezierCurveTo(x1,y0-19-wave*6,x1,y1,x2,y2);ctx.stroke();
      ctx.strokeStyle='#57dcff';ctx.lineWidth=2.4;glow('#35cfff',10);ctx.beginPath();ctx.moveTo(x0,y0);ctx.bezierCurveTo(x1,y0-19-wave*6,x1,y1,x2,y2);ctx.stroke();
    }
    ctx.restore();ctx.shadowBlur=0;
  }
  function drawBoss(){
    const bob=Math.sin(boss.phase*3)*2,pulse=1+Math.sin(boss.phase*4)*.018;
    const captain=boss.kind==='captain';if(!captain)drawKrakenTentacles(bob);
    ctx.save();ctx.translate(boss.x,boss.y+bob);ctx.scale(pulse,pulse);glow(captain?'#d9f5ff':'#5d7dff',20);
    if(captain&&captainSprite.complete&&captainSprite.naturalWidth){ctx.drawImage(captainSprite,-91,-92,182,184);}else if(!captain&&bossSprite.complete&&bossSprite.naturalWidth){ctx.drawImage(bossSprite,-91,-83,182,166);}else{ctx.fillStyle=captain?'#c8e8ff':'#46215d';ctx.beginPath();ctx.ellipse(0,0,58,48,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=captain?'#6cdfff':'#62f6ff';ctx.beginPath();ctx.arc(0,-4,13,0,Math.PI*2);ctx.fill();}
    ctx.restore();ctx.shadowBlur=0;
    const w=220,color=captain?'#48bfff':'#a760ff';ctx.fillStyle='#1c2547';ctx.fillRect(W/2-w/2,28,w,8);ctx.fillStyle=color;glow(color,11);ctx.fillRect(W/2-w/2,28,w*(boss.hp/boss.maxHp),8);ctx.shadowBlur=0;ctx.fillStyle=captain?'#d8f6ff':'#cbd8ff';ctx.font='11px ui-monospace';ctx.textAlign='center';ctx.fillText(boss.name.toUpperCase(),W/2,23);
  }
  function drawPower(p){const c=p.type==='shield'?'#7dffff':p.type==='rapid'?'#ffdc70':'#fb8cff';ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);glow(c,16);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(12,0);ctx.lineTo(0,14);ctx.lineTo(-12,0);ctx.closePath();ctx.fill();ctx.fillStyle='#081030';ctx.font='bold 11px ui-monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.type==='shield'?'S':p.type==='rapid'?'R':'3',0,1);ctx.restore();ctx.shadowBlur=0;}
  function drawBullets(){for(const b of bullets){if(b.flame){glow('#ff6a35',b.playerFlame?19:15);ctx.fillStyle='#ff7b31';ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffc34d';ctx.beginPath();ctx.arc(b.x,b.y,b.r+1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff4a0';ctx.beginPath();ctx.arc(b.x,b.y,b.r*.48,0,Math.PI*2);ctx.fill();}else{glow('#8ffffc',11);ctx.fillStyle='#ecffcb';ctx.fillRect(b.x-2,b.y-12,4,16);}}for(const b of enemyBullets){glow('#ff81ca',11);ctx.fillStyle='#ff9bd9';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;}
  function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.8);ctx.fillStyle=p.color;glow(p.color,8);ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.shadowBlur=0;}
  function drawOverlay(){
    if(state==='playing')return;
    if(state==='title'&&selectorBackground.complete&&selectorBackground.naturalWidth){
      const scale=Math.max(W/selectorBackground.naturalWidth,H/selectorBackground.naturalHeight),drawW=selectorBackground.naturalWidth*scale,drawH=selectorBackground.naturalHeight*scale;
      ctx.drawImage(selectorBackground,(W-drawW)/2,(H-drawH)/2,drawW,drawH);
      const veil=ctx.createLinearGradient(0,0,0,H);veil.addColorStop(0,'#020613a8');veil.addColorStop(.5,'#02081778');veil.addColorStop(1,'#020613b8');ctx.fillStyle=veil;ctx.fillRect(0,0,W,H);
    }else{ctx.fillStyle='#07102ad9';ctx.fillRect(0,0,W,H);}
    ctx.textAlign='center';
    if(state==='title'){ctx.fillStyle='#fbf7ff';glow('#8bbdff',24);ctx.font='700 44px -apple-system';ctx.fillText('Starry',W/2,70);ctx.shadowBlur=0;ctx.fillStyle='#f8e8a6';ctx.font='600 13px -apple-system';ctx.fillText('A COSMIC ARCADE JOURNEY',W/2,98);const previewScale={dog:1.7,angler:2.4,pegasus:4,fire:2.6,sky:2.7,captain:2.4,traveler:5}[selectedCharacter]||2.5;drawShip(W/2,273,previewScale,false);ctx.fillStyle='#d1dcff';ctx.font='600 16px -apple-system';ctx.fillText(characterName(selectedCharacter).toUpperCase(),W/2,473);ctx.font='14px -apple-system';ctx.fillText('Choose a traveler below to preview them.',W/2,504);ctx.fillText('Arrow keys / WASD to steer  •  Space to fire',W/2,530);ctx.fillStyle='#9feaff';ctx.font='600 16px -apple-system';ctx.fillText('PRESS ENTER OR CLICK BEGIN JOURNEY',W/2,574);}else if(state==='paused'){ctx.fillStyle='#dbe8ff';ctx.font='700 34px -apple-system';ctx.fillText('PAUSED',W/2,290);ctx.font='16px -apple-system';ctx.fillText('Press P to continue your journey',W/2,322);}else if(state==='gameover'){ctx.fillStyle='#ffd2e8';ctx.font='700 36px -apple-system';ctx.fillText('JOURNEY COMPLETE',W/2,270);ctx.fillStyle='#fff2ad';ctx.font='600 17px -apple-system';ctx.fillText(`FINAL SCORE ${String(score).padStart(6,'0')}`,W/2,309);ctx.fillStyle='#b9e9ff';ctx.font='15px -apple-system';ctx.fillText('Press Enter or click Begin again',W/2,350);}
  }
  function draw(){ctx.save();if(shake){ctx.translate(rand(-shake,shake),rand(-shake,shake));}drawStars();for(const p of powerups)drawPower(p);for(const e of enemies)if(!e.dead)drawEnemy(e);if(boss)drawBoss();drawBullets();drawDragon();drawShip(player?.x||W/2,player?.y||H-70,1,player?.inv>0);drawParticles();ctx.restore();drawOverlay();}
  function loop(t){const dt=Math.min(.033,(t-last||0)/1000);last=t;update(dt);draw();requestAnimationFrame(loop);}
  function launch(){if(state==='paused'){state='playing';statusEl.textContent='Journey resumed';return;}resetGame();}
  addEventListener('keydown',e=>{if(e.key==='Escape'){location.href='arcade-launcher.html';return;}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();if(e.key==='p'||e.key==='P'){if(state==='playing'){state='paused';statusEl.textContent='Journey paused';}else if(state==='paused'){state='playing';statusEl.textContent='Journey resumed';}return;}if((e.key==='Enter')&&(state==='title'||state==='gameover')){launch();return;}keys.add(e.key);});
  addEventListener('keyup',e=>keys.delete(e.key));
  document.querySelectorAll('[data-key]').forEach(btn=>{const down=e=>{e.preventDefault();if((state==='title'||state==='gameover'))launch();keys.add(btn.dataset.key);btn.setPointerCapture?.(e.pointerId)},up=e=>{e.preventDefault();keys.delete(btn.dataset.key)};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up)});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  arcadeHomeBtn.addEventListener('click',()=>location.href='arcade-launcher.html');launchBtn.addEventListener('click',launch);soundBtn.addEventListener('click',()=>{muted=!muted;soundBtn.textContent=`Sound + music: ${muted?'off':'on'}`;if(!muted)sound(520,.08,'sine',.03,90);});characterButtons.forEach(button=>button.addEventListener('click',()=>selectCharacter(button.dataset.character)));
  initStars();makePlayer();updateCharacterPicker();updateHud();requestAnimationFrame(loop);
})();
</script>
