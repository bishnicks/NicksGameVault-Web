<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 4%,#315f4d,#10231f 42%,#070d12 78%);color:#f5f5e8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}.app{width:min(1040px,100%);padding:20px;border:1px solid #d5edce43;border-radius:28px;background:linear-gradient(145deg,#1a2d2aef,#101b22ed 58%,#162128ed);box-shadow:0 28px 74px #00070bb8,inset 0 1px #ffffff29;backdrop-filter:blur(20px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2px 3px 17px}.brand{display:flex;align-items:center;gap:11px}.mark{position:relative;width:47px;height:47px;border-radius:15px;background:radial-gradient(circle at 30% 28%,#c5ff8d,#4eaa63 45%,#155a43 72%);box-shadow:inset 0 2px #ffffff78,0 0 0 1px #dbffd54f,0 9px 20px #02090680}.mark:before,.mark:after{content:"";position:absolute;border-radius:50%;background:#f4ffd4;box-shadow:inset 0 0 0 1px #123321}.mark:before{width:10px;height:10px;top:11px;left:13px}.mark:after{width:10px;height:10px;top:11px;right:13px}.eyebrow{margin:0 0 2px;color:#a9caad;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(1.45rem,4vw,2.1rem);letter-spacing:-.055em}.hud{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}.chip{padding:7px 9px;border:1px solid #c9e6c227;border-radius:9px;background:#06130f8a;color:#a5c5ad;font-size:9px;font-weight:800;letter-spacing:.08em}.chip b{display:block;margin-top:2px;color:#fff3b1;font-size:11px;letter-spacing:.02em}.stage{padding:1px;border-radius:20px;background:linear-gradient(135deg,#d5f9b98c,#4eac8a55 50%,#b6c7ff6b);box-shadow:0 16px 34px #0208067d}canvas{display:block;width:100%;height:auto;border-radius:19px;background:#0a1b16;cursor:crosshair}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 3px 2px;color:#b8d2bd;font-size:11px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{padding:8px 12px;border:1px solid #cce9c947;border-radius:10px;background:linear-gradient(180deg,#315c51,#17382f);box-shadow:inset 0 1px #ffffff2d,0 4px 10px #03090670;color:#f5fff3;font:700 11px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;cursor:pointer;transition:transform .15s,background .15s}button:hover,button:focus-visible{outline:2px solid #dfffa2;background:linear-gradient(180deg,#4f8974,#275544);transform:translateY(-1px)}.hint{text-align:right;color:#8daa94}@media(max-width:730px){body{padding:10px}.app{padding:12px;border-radius:20px}header,.controls{align-items:flex-start;flex-direction:column}.hud{justify-content:flex-start}.hint{text-align:left}}
*{-webkit-tap-highlight-color:transparent}.touch-pad{display:none;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,52px);gap:7px;justify-content:center;padding-top:12px}.touch-pad button{font-size:22px;padding:0;touch-action:manipulation}.touch-pad [data-move="up"]{grid-column:2}.touch-pad [data-move="left"]{grid-column:1}.touch-pad [data-move="down"]{grid-column:2}.touch-pad [data-move="right"]{grid-column:3}@media(max-width:730px),(pointer:coarse){html,body{overscroll-behavior:none}body{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));-webkit-user-select:none;user-select:none}.touch-pad{display:grid}canvas{touch-action:none}.chip{padding:5px 7px}.controls{padding-top:8px}}@media(orientation:landscape) and (max-height:500px){html,body{width:100%;height:100%;overflow:hidden}body{display:block;min-height:0;padding-top:max(4px,env(safe-area-inset-top));padding-bottom:max(4px,env(safe-area-inset-bottom));padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}.app{display:flex;align-items:center;width:calc(100vw - max(12px,env(safe-area-inset-left)) - max(12px,env(safe-area-inset-right)));height:calc(100dvh - 8px);max-width:none;margin:0 auto;padding:4px;border-radius:12px;overflow:hidden}header,.controls{display:none}.stage{flex:0 1 auto;width:auto;height:100%;max-width:calc(100vw - 190px);aspect-ratio:920/590;padding:1px;border-radius:10px;overflow:hidden}.stage canvas{display:block;width:100%;height:100%;object-fit:contain;border-radius:9px}.touch-pad{display:grid;position:fixed;right:max(12px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:10;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:6px;padding:0}.touch-pad button{font-size:19px;padding:0}}

<body>
<main class="app">
 <header><div class="brand"><div class="mark" aria-hidden="true"></div><div><p class="eyebrow">A living snake journey</p><h1>Wildscale</h1></div></div><div class="hud"><div class="chip">SCENE<b id="scene">RAINFOREST</b></div><div class="chip">LEVEL<b id="level">01</b></div><div class="chip">REWARDS<b id="rewards">0 / 6</b></div><div class="chip">LENGTH<b id="length">04</b></div><div class="chip">SCORE<b id="score">000000</b></div><div class="chip">BEST<b id="best">000000</b></div></div></header>
 <div class="stage"><canvas id="game" width="920" height="590" aria-label="Wildscale snake game. Use arrow keys or WASD to guide the snake."></canvas></div>
 <div class="touch-pad" aria-label="Touch movement controls"><button data-move="up" aria-label="Move up">▲</button><button data-move="left" aria-label="Move left">◀</button><button data-move="down" aria-label="Move down">▼</button><button data-move="right" aria-label="Move right">▶</button></div>
 <div class="controls"><div class="buttons"><button id="hub" type="button">Game Hub</button><button id="start" type="button">Begin Expedition</button><button id="sound" type="button">Sound: on</button></div><div id="status">Arrow keys / WASD to glide · Collect every reward · Grow your snake</div><div class="hint">P pause · Esc Game Hub</div></div>
</main>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,sceneEl=document.getElementById('scene'),levelEl=document.getElementById('level'),rewardsEl=document.getElementById('rewards'),lengthEl=document.getElementById('length'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status'),hubBtn=document.getElementById('hub'),startBtn=document.getElementById('start'),soundBtn=document.getElementById('sound');
const G={x:23,y:25,cols:23,rows:14,cell:38},same=(a,b)=>a.x===b.x&&a.y===b.y,clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),random=(a,b)=>a+Math.random()*(b-a),center=p=>({x:G.x+p.x*G.cell+G.cell/2,y:G.y+p.y*G.cell+G.cell/2});
const scenes=[
 {name:'Verdant Rainforest',short:'RAINFOREST',image:'wildscale-rainforest.png',reward:'sunberry',label:'SUNBERRIES',goal:6,speed:158,colors:['#52ba67','#c6ff83','#154c35'],obstacles:[]},
 {name:'Canyon Oasis',short:'DESERT OASIS',image:'wildscale-desert-oasis.png',reward:'date',label:'DESERT DATES',goal:7,speed:142,colors:['#d4a04b','#fff0a5','#734420'],obstacles:[]},
 {name:'Moonwater Fen',short:'MOONLIT SWAMP',image:'wildscale-moonlit-swamp.png',reward:'beetle',label:'GLOW BEETLES',goal:8,speed:130,colors:['#4d82bb','#a9fbff','#15365a'],obstacles:[]},
 {name:'Dawncrest Meadow',short:'ALPINE MEADOW',image:'wildscale-alpine-meadow.png',reward:'berry',label:'MOUNTAIN BERRIES',goal:9,speed:118,colors:['#77ae54','#f4d879','#345d36'],obstacles:[]}
];
const images=scenes.map(scene=>{const img=new Image();img.src=scene.image;return img});
let state='title',sceneIndex=0,level=1,snake=[],dir={x:1,y:0},nextDir={x:1,y:0},reward=null,collected=0,score=0,best=0,accumulator=0,last=0,transition=0,particles=[],muted=false,audio=null,beat=0,flash=0,combo=0;
try{best=Number(localStorage.getItem('wildscaleBest')||0)}catch(_){}
function scene(){return scenes[sceneIndex]}function inBounds(p){return p.x>=0&&p.x<G.cols&&p.y>=0&&p.y<G.rows}function obstacle(p){return scene().obstacles.some(o=>o[0]===p.x&&o[1]===p.y)}
function sound(f=.1,d=.07,type='sine',v=.025,slide=0,delay=0){if(muted)return;try{audio||=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const at=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,at);o.frequency.exponentialRampToValueAtTime(Math.max(24,f+slide),at+d);g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g).connect(audio.destination);o.start(at);o.stop(at+d)}catch(_){}}
function burst(px,py,color,n=18){for(let i=0;i<n;i++){const a=random(0,Math.PI*2),v=random(30,180);particles.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:random(.35,.9),size:random(1,4),color})}}
function spawnReward(){let tries=0;do{reward={x:Math.floor(random(1,G.cols-1)),y:Math.floor(random(1,G.rows-1)),pulse:random(0,6)}}while((snake.some(s=>same(s,reward))||obstacle(reward))&&++tries<300)}
function resetLevel(){const midY=Math.floor(G.rows/2);snake=[{x:7,y:midY},{x:6,y:midY},{x:5,y:midY},{x:4,y:midY}];dir={x:1,y:0};nextDir={x:1,y:0};collected=0;combo=0;accumulator=0;particles=[];spawnReward();updateHud();}
function updateHud(){sceneEl.textContent=scene().short;levelEl.textContent=String(level).padStart(2,'0');rewardsEl.textContent=`${collected} / ${scene().goal+Math.floor((level-1)/4)}`;lengthEl.textContent=String(snake.length).padStart(2,'0');scoreEl.textContent=String(score).padStart(6,'0');bestEl.textContent=String(best).padStart(6,'0')}
function begin(){score=0;level=1;sceneIndex=0;state='play';resetLevel();startBtn.textContent='Restart Expedition';statusEl.textContent=`${scene().name} — gather every ${scene().label.toLowerCase()}.`;sound(280,.13,'sine',.042,180);sound(420,.09,'triangle',.024,90,.06)}
function end(reason){state='over';if(score>best){best=score;try{localStorage.setItem('wildscaleBest',best)}catch(_){}}updateHud();statusEl.textContent=reason;startBtn.textContent='Begin Again';sound(120,.36,'sawtooth',.065,-70)}
function advance(){state='transition';transition=1.75;flash=1;score+=500;sceneIndex=(sceneIndex+1)%scenes.length;level++;sound(480,.16,'sine',.05,180);sound(680,.24,'triangle',.035,120,.12)}
function collect(){const p=center(reward),target=scene().goal+Math.floor((level-1)/4);collected++;combo++;score+=120+Math.min(160,combo*20);burst(p.x,p.y,scene().colors[1],26);flash=.42;sound(530,.10,'triangle',.052,190);sound(730,.075,'sine',.028,100,.07);if(collected>=target){advance();return}spawnReward();updateHud()}
function step(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(!inBounds(head)){end('Your trail reaches the edge — begin again when ready.');return}if(obstacle(head)){end('A natural obstacle blocks the trail — begin again when ready.');return}if(snake.some(s=>same(s,head))){end('Your growing trail loops back on itself — begin again when ready.');return}snake.unshift(head);if(reward&&same(head,reward))collect();else snake.pop();updateHud()}
function queue(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;nextDir={x:dx,y:dy}}
function cover(img){if(!img.complete||!img.naturalWidth)return;const scale=Math.max(W/img.naturalWidth,H/img.naturalHeight),iw=img.naturalWidth*scale,ih=img.naturalHeight*scale;x.drawImage(img,(W-iw)/2,(H-ih)/2,iw,ih)}
function drawBoard(){cover(images[sceneIndex]);const veil=x.createLinearGradient(0,0,0,H);veil.addColorStop(0,'#03100926');veil.addColorStop(.52,'#06110c0e');veil.addColorStop(1,'#020a08a1');x.fillStyle=veil;x.fillRect(0,0,W,H);x.strokeStyle='#ecffdc7e';x.lineWidth=2;x.shadowColor=scene().colors[1];x.shadowBlur=18;x.strokeRect(G.x-9,G.y-9,G.cols*G.cell+18,G.rows*G.cell+18);x.shadowBlur=0;for(let i=0;i<16;i++){const px=(i*173+41)%W,py=(i*109+beat*6)%H;x.fillStyle=sceneIndex===2?'#9fe8ff80':sceneIndex===1?'#fff2be55':'#e9ffb144';x.beginPath();x.arc(px,py,1+(i%3)*.35,0,Math.PI*2);x.fill()}}
function drawObstacle(o,index){const p=center({x:o[0],y:o[1]}),kind=sceneIndex; x.save();x.translate(p.x,p.y);if(kind===0){x.shadowColor='#06170e';x.shadowBlur=12;x.fillStyle='#4c3927';x.beginPath();x.ellipse(0,0,17,13,.35,0,Math.PI*2);x.fill();x.strokeStyle='#9e7043';x.lineWidth=2;x.beginPath();x.moveTo(-14,-4);x.quadraticCurveTo(0,-12,16,-3);x.moveTo(-14,5);x.quadraticCurveTo(2,-1,13,8);x.stroke()}else if(kind===1){x.shadowColor='#6a3518';x.shadowBlur=12;x.fillStyle='#92512a';x.beginPath();x.ellipse(0,0,16,15,.15,0,Math.PI*2);x.fill();x.fillStyle='#d09155';x.beginPath();x.ellipse(-3,-4,8,5,-.3,0,Math.PI*2);x.fill()}else if(kind===2){x.shadowColor='#021625';x.shadowBlur=15;x.fillStyle='#203e4b';x.beginPath();x.ellipse(0,0,18,12,-.2,0,Math.PI*2);x.fill();x.strokeStyle='#7ebdb2';x.lineWidth=2;x.beginPath();x.arc(0,0,12,.3,Math.PI*1.8);x.stroke()}else{x.shadowColor='#293a28';x.shadowBlur=12;x.fillStyle='#7a7970';x.beginPath();x.ellipse(0,0,16,14,.55,0,Math.PI*2);x.fill();x.fillStyle='#b9b6a0';x.beginPath();x.ellipse(-4,-5,7,4,.4,0,Math.PI*2);x.fill()}x.restore()}
function drawReward(){if(!reward)return;const p=center(reward),t=performance.now()/1000,pulse=1+Math.sin(t*5+reward.pulse)*.1,glow=scene().colors[1];x.save();x.translate(p.x,p.y);x.scale(pulse,pulse);x.shadowColor=glow;x.shadowBlur=23;if(scene().reward==='sunberry'){const g=x.createRadialGradient(-5,-7,2,0,0,16);g.addColorStop(0,'#fff7a2');g.addColorStop(.38,'#ffba37');g.addColorStop(1,'#c84c19');x.fillStyle=g;x.beginPath();x.arc(0,0,14,0,Math.PI*2);x.fill();x.strokeStyle='#5d702c';x.lineWidth=3;x.beginPath();x.moveTo(0,-12);x.quadraticCurveTo(6,-20,13,-16);x.stroke()}else if(scene().reward==='date'){x.fillStyle='#74401f';x.beginPath();x.ellipse(0,1,11,16,.3,0,Math.PI*2);x.fill();x.fillStyle='#df9b43';x.beginPath();x.ellipse(-3,-4,4,9,.3,0,Math.PI*2);x.fill();x.strokeStyle='#8dab53';x.lineWidth=2;x.beginPath();x.moveTo(1,-14);x.lineTo(8,-21);x.stroke()}else if(scene().reward==='beetle'){x.fillStyle='#162850';x.beginPath();x.ellipse(0,0,12,16,0,0,Math.PI*2);x.fill();x.fillStyle='#56e6ff';x.beginPath();x.ellipse(0,1,9,13,0,0,Math.PI*2);x.fill();x.strokeStyle='#d2ffff';x.lineWidth=1.4;x.beginPath();x.moveTo(0,-10);x.lineTo(0,13);x.stroke();for(const side of[-1,1]){x.beginPath();x.moveTo(side*7,-3);x.lineTo(side*16,-8);x.moveTo(side*8,5);x.lineTo(side*16,11);x.stroke()}}else{x.fillStyle='#295e91';x.beginPath();x.arc(-7,2,8,0,Math.PI*2);x.arc(5,4,9,0,Math.PI*2);x.arc(2,-7,8,0,Math.PI*2);x.fill();x.fillStyle='#a9e9ff';x.beginPath();x.arc(-9,-1,2,0,Math.PI*2);x.arc(1,-10,2,0,Math.PI*2);x.arc(5,1,2,0,Math.PI*2);x.fill();x.strokeStyle='#5d8c39';x.lineWidth=2;x.beginPath();x.moveTo(0,-12);x.lineTo(6,-21);x.stroke()}x.restore();x.shadowBlur=0}
function drawSnake(){for(let i=snake.length-1;i>=0;i--){const p=center(snake[i]),progress=1-i/Math.max(1,snake.length),r=10+progress*7;let angle=0;if(i===0)angle=Math.atan2(dir.y,dir.x);else{const ahead=snake[i-1];angle=Math.atan2(ahead.y-snake[i].y,ahead.x-snake[i].x)}x.save();x.translate(p.x,p.y);x.rotate(angle);x.shadowColor='#03130b';x.shadowBlur=10;x.fillStyle=i===0?'#226f4c':'#1b6241';x.beginPath();x.ellipse(0,0,r*1.24,r*.9,0,0,Math.PI*2);x.fill();const scale=x.createLinearGradient(-r,0,r,0);scale.addColorStop(0,'#0b3b2a');scale.addColorStop(.45,'#5eb76d');scale.addColorStop(.72,'#c1e97f');scale.addColorStop(1,'#145238');x.fillStyle=scale;x.beginPath();x.ellipse(0,-1,r*1.08,r*.72,0,0,Math.PI*2);x.fill();x.strokeStyle='#e4ff9c88';x.lineWidth=1.1;for(let k=-1;k<=1;k++){x.beginPath();x.moveTo(-r*.45,k*r*.30);x.lineTo(-r*.05,k*r*.08);x.lineTo(r*.35,k*r*.30);x.stroke()}if(i===0){x.shadowBlur=0;x.fillStyle='#eaffbb';x.beginPath();x.arc(r*.52,-r*.38,3.5,0,Math.PI*2);x.arc(r*.52,r*.38,3.5,0,Math.PI*2);x.fill();x.fillStyle='#102916';x.beginPath();x.arc(r*.63,-r*.38,1.45,0,Math.PI*2);x.arc(r*.63,r*.38,1.45,0,Math.PI*2);x.fill();if(Math.sin(beat*10)>-.12){x.strokeStyle='#e86b70';x.lineWidth=1.5;x.beginPath();x.moveTo(r*1.03,0);x.lineTo(r*1.72,0);x.moveTo(r*1.72,0);x.lineTo(r*1.98,-3);x.moveTo(r*1.72,0);x.lineTo(r*1.98,3);x.stroke()}}x.restore()}x.shadowBlur=0}
function drawParticles(dt){particles=particles.filter(p=>(p.life-=dt)>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=16*dt;x.globalAlpha=Math.max(0,p.life/.9);x.fillStyle=p.color;x.beginPath();x.arc(p.x,p.y,p.size,0,Math.PI*2);x.fill()}x.globalAlpha=1}
function overlay(){if(state==='play')return;x.fillStyle='#020a08a1';x.fillRect(0,0,W,H);x.textAlign='center';if(state==='title'){x.fillStyle='#f5ffdc';x.shadowColor='#aaff93';x.shadowBlur=23;x.font='800 52px -apple-system';x.fillText('WILDSCALE',W/2,195);x.shadowBlur=0;x.fillStyle='#ffec9d';x.font='800 14px -apple-system';x.fillText('A LIVING SNAKE JOURNEY',W/2,224);x.fillStyle='#d8e8db';x.font='16px -apple-system';x.fillText('Glide through four living habitats. Gather rewards. Grow without crossing your trail.',W/2,278);x.fillStyle='#effac9';x.font='700 16px -apple-system';x.fillText('PRESS ENTER OR CLICK BEGIN EXPEDITION',W/2,357)}else if(state==='pause'){x.fillStyle='#efffe4';x.font='800 42px -apple-system';x.fillText('THE WILDS HOLD STILL',W/2,284);x.fillStyle='#cde4cf';x.font='16px -apple-system';x.fillText('Press P to resume your expedition',W/2,318)}else if(state==='transition'){x.fillStyle='#fff7cf';x.shadowColor=scene().colors[1];x.shadowBlur=20;x.font='800 38px -apple-system';x.fillText(scene().name.toUpperCase(),W/2,278);x.shadowBlur=0;x.fillStyle='#e6f1dc';x.font='16px -apple-system';x.fillText(`${scene().label} await — the trail grows faster.`,W/2,314)}else{x.fillStyle='#fff2d0';x.font='800 40px -apple-system';x.fillText('THE TRAIL ENDS HERE',W/2,268);x.fillStyle='#fcdf8d';x.font='700 18px -apple-system';x.fillText(`FINAL SCORE ${String(score).padStart(6,'0')}  ·  LENGTH ${snake.length}`,W/2,310);x.fillStyle='#d7e9d8';x.font='16px -apple-system';x.fillText('Press Enter or click Begin Again',W/2,351)}}
function draw(dt){drawBoard();scene().obstacles.forEach(drawObstacle);drawReward();drawSnake();drawParticles(dt);if(flash>0){x.fillStyle=`rgba(255,255,210,${flash*.12})`;x.fillRect(0,0,W,H)}overlay()}
function update(dt){beat+=dt;flash=Math.max(0,flash-dt*2.2);if(state==='transition'){transition-=dt;if(transition<=0){resetLevel();state='play';statusEl.textContent=`Level ${level}: ${scene().name} — collect ${scene().label.toLowerCase()}.`}return}if(state!=='play')return;accumulator+=dt*1000;const every=Math.max(72,scene().speed-Math.floor((level-1)/4)*10);while(accumulator>=every&&state==='play'){accumulator-=every;step()}}
function loop(now){const dt=Math.min(.033,(now-last||0)/1000);last=now;update(dt);draw(dt);requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const keys={ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1]};if(e.key==='Escape'){location.href='arcade-launcher.html';return}if(e.key in keys){e.preventDefault();queue(...keys[e.key])}if(e.key==='p'||e.key==='P'){if(state==='play'){state='pause';statusEl.textContent='Paused — press P to continue.'}else if(state==='pause'){state='play';statusEl.textContent='The trail moves again.'}}if(e.key==='Enter'&&(state==='title'||state==='over'))begin()});
hubBtn.onclick=()=>location.href='arcade-launcher.html';startBtn.onclick=()=>begin();soundBtn.onclick=()=>{muted=!muted;soundBtn.textContent=`Sound: ${muted?'off':'on'}`;if(!muted)sound(520,.08,'sine',.03,90)};resetLevel();updateHud();requestAnimationFrame(loop);
document.querySelectorAll('[data-move]').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();const move={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[btn.dataset.move];if(state==='title'||state==='over')begin();else queue(...move)}));if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
