<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
 <meta name="theme-color" content="#ef79b9">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <title>Zoe Dress-Up</title>
 <link rel="stylesheet" href="assets/css/style.css">
 <script src="lib/kiwi.js"></script>
 <script src="lib/kiwipreloader.js"></script>
 <script src="build/zoedressup-1.0.0.js?v=38"></script>
</head>
<body>
 <main class="game-shell" aria-label="Zoe Dress-Up game">
  <div id="content"></div>
 </main>
 <button class="start-button" id="start-button" type="button" hidden>Tap to Start</button>
 <a class="hub-button" href="../arcade-launcher.html?v=38" aria-label="Return to Nick's Game Vault">Game Hub</a>
 <script>
 (()=>{
  const button=document.getElementById('start-button');
  let starting=false;
  const currentState=()=>window.zoeDressUpGame&&zoeDressUpGame.states&&zoeDressUpGame.states.current&&zoeDressUpGame.states.current.config&&zoeDressUpGame.states.current.config.name;
  const begin=event=>{
   event.preventDefault();
   if(starting||currentState()!=='MainMenu')return;
   starting=true;
   button.hidden=true;
   zoeDressUpGame.states.switchState('Zoe');
  };
  button.addEventListener('pointerup',begin);
  button.addEventListener('touchend',begin,{passive:false});
  button.addEventListener('click',begin);
  const watch=()=>{
   if(!starting)button.hidden=currentState()!=='MainMenu';
   requestAnimationFrame(watch);
  };
  watch();
 })();
 </script>
</body>
</html>
